name: Release Python Protocol Package

on:
  push:
    tags:
      - 'protocol/v*'
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  release:
    name: Release Python Protocol
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Validate package metadata
        working-directory: ./protocol/python
        run: |
          python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              meta = tomllib.load(f)['project']
          required = ['name', 'version', 'description', 'license', 'authors', 'classifiers', 'urls']
          for key in required:
              assert key in meta, f'Missing: {key}'
          assert meta['name'] == 'g8e'
          assert 'Homepage' in meta['urls']
          assert 'Repository' in meta['urls']
          print('Package metadata OK')
          "

      - name: Copy protocol constants into package
        run: |
          mkdir -p protocol/python/g8e/_data
          cp protocol/constants/*.json protocol/python/g8e/_data/
          cp -r protocol/constants/doctrine protocol/python/g8e/_data/

      - name: Build package
        working-directory: ./protocol/python
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          twine check dist/*

      - name: Parse Version
        id: parse_version
        run: |
          TAG=${GITHUB_REF#refs/tags/protocol/v}
          echo "version=${TAG}" >> $GITHUB_OUTPUT

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: protocol/python/dist/

  verify-install:
    name: Verify PyPI Install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: release
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Fresh install from PyPI
        shell: bash
        run: |
          python -m venv testenv
          if [ "$RUNNER_OS" == "Windows" ]; then
            source testenv/Scripts/activate
          else
            source testenv/bin/activate
          fi
          python -m pip install --upgrade pip
          # Poll the PyPI JSON API (not pip's CDN-cached index) until the version
          # is published. pip's index can lag the API by minutes on some CDN
          # edges (notably macOS), causing spurious "No matching distribution"
          # failures even after a successful upload. The JSON API is the source
          # of truth for what has been accepted by PyPI.
          VERSION=${{ needs.release.outputs.version }}
          MAX_ATTEMPTS=12
          for i in $(seq 1 $MAX_ATTEMPTS); do
            if python -c "
          import json, sys, urllib.request
          url = 'https://pypi.org/pypi/g8e/json'
          with urllib.request.urlopen(url, timeout=15) as resp:
            data = json.load(resp)
          if '${VERSION}' in data.get('releases', {}):
              files = data['releases']['${VERSION}']
              if files:
                  print('Version ${VERSION} published: ' + ', '.join(f['filename'] for f in files))
                  sys.exit(0)
          sys.exit(1)
          "; then
              break
            fi
            if [ $i -eq $MAX_ATTEMPTS ]; then
              echo "g8e==${VERSION} not found on PyPI after $MAX_ATTEMPTS attempts"
              exit 1
            fi
            echo "PyPI API does not list ${VERSION} yet (attempt $i/$MAX_ATTEMPTS), retrying in 15s..."
            sleep 15
          done
          # Install directly from the artifact URL reported by the PyPI JSON
          # API. The JSON API is the source of truth; pip's simple index is
          # still CDN-cached and can lag behind, so using the canonical file
          # URL bypasses the stale listing while still resolving dependencies
          # from PyPI.
          ARTIFACT_URL=$(python -c "
          import json, urllib.request, sys
          url = 'https://pypi.org/pypi/g8e/json'
          data = json.loads(urllib.request.urlopen(url, timeout=15).read())
          files = data.get('releases', {}).get('${VERSION}', [])
          if not files:
              sys.exit(1)
          for f in files:
              if f['filename'].endswith('-py3-none-any.whl'):
                  print(f['url'])
                  sys.exit(0)
          print(files[0]['url'])
          ")
          pip install --no-cache-dir "g8e @ ${ARTIFACT_URL}"
          python -c "import g8e; print(f'g8e version: {g8e.__version__}'); assert g8e.__version__ == '${VERSION}'"
          echo "Fresh PyPI install verified successfully"

      - name: Verify imports work
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            source testenv/Scripts/activate
          else
            source testenv/bin/activate
          fi
          python -c "from g8e.constants import EVENTS, STATUS, COLLECTIONS, KV, CHANNELS, INTENTS, PROMPTS, ComponentName; \
              assert len(EVENTS) > 0, 'EVENTS empty'; \
              assert len(COLLECTIONS) > 0, 'COLLECTIONS empty'; \
              assert len(KV) > 0, 'KV empty'; \
              assert len(CHANNELS) > 0, 'CHANNELS empty'; \
              assert len(INTENTS) > 0, 'INTENTS empty'; \
              assert len(PROMPTS) > 0, 'PROMPTS empty'; \
              print('All constants OK')"
          python -c "from g8e.models import RequestContext, PlatformSettings, GovernanceEnvelope, compute_transaction_hash; print('Models OK')"
          python -c "import g8e.enums; print('Enums OK')"

