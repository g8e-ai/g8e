name: Release Python Protocol Package

on:
  push:
    tags:
      - 'protocol/v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release Python Protocol
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Build package
        working-directory: ./protocol/python
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          twine check dist/*

      - name: Parse Version
        id: parse_version
        run: |
          TAG=${GITHUB_REF#refs/tags/protocol/v}
          echo "version=${TAG}" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: protocol/python/dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.parse_version.outputs.tag }}
          name: g8e-protocol Python v${{ steps.parse_version.outputs.version }}
          body: |
            ## g8e-protocol Python Package v${{ steps.parse_version.outputs.version }}

            Official Python protocol library for the g8e zero-trust execution platform.

            ### Installation
            ```bash
            pip install g8e-protocol==${{ steps.parse_version.outputs.version }}
            ```

            ### Changes
            See [CHANGELOG.md](https://github.com/g8e-ai/g8e/blob/main/CHANGELOG.md) for details.
          draft: false
          prerelease: false
          generate_release_notes: true

