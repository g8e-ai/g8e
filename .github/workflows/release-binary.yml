name: Release Binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release Binary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: true

      - name: Parse Version
        id: parse_version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Build all platforms
        run: make build-all

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.parse_version.outputs.tag }}
          name: g8e v${{ steps.parse_version.outputs.version }}
          body: |
            ## g8e v${{ steps.parse_version.outputs.version }}

            ### Go Module
            ```bash
            go get github.com/g8e-ai/g8e@v${{ steps.parse_version.outputs.version }}
            ```

            ### Changes
            See [CHANGELOG.md](https://github.com/g8e-ai/g8e/blob/main/CHANGELOG.md) for details.
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            bin/g8e-*
