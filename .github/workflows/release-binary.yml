name: Release Binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release Binary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.parse_version.outputs.version }}
      tag: ${{ steps.parse_version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true

      - name: Parse Version
        id: parse_version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${GITHUB_REF#refs/tags/v}
          MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1-2)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version_major_minor=${MAJOR_MINOR}" >> $GITHUB_OUTPUT

      - name: Build all platforms
        run: make build-all

      - name: Generate SHA256 checksums
        run: |
          cd bin
          sha256sum g8e-linux-* g8e-darwin-* g8e-windows-*.exe > checksums-sha256.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign binaries
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          for bin in bin/g8e-linux-amd64 bin/g8e-linux-arm64 bin/g8e-linux-386 \
                     bin/g8e-darwin-amd64 bin/g8e-darwin-arm64 \
                     bin/g8e-windows-amd64.exe bin/g8e-windows-arm64.exe; do
            cosign sign-blob --yes "$bin" --output-signature "$bin.sig"
          done

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ steps.parse_version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: g8e v${{ steps.parse_version.outputs.version }}
          body_path: docs/release_notes/v${{ steps.parse_version.outputs.version_major_minor }}.x/v${{ steps.parse_version.outputs.version }}.md
          draft: false
          prerelease: false
          files: |
            bin/g8e-linux-amd64
            bin/g8e-linux-amd64.sig
            bin/g8e-linux-amd64.sha256
            bin/g8e-linux-arm64
            bin/g8e-linux-arm64.sig
            bin/g8e-linux-arm64.sha256
            bin/g8e-linux-386
            bin/g8e-linux-386.sig
            bin/g8e-linux-386.sha256
            bin/g8e-darwin-amd64
            bin/g8e-darwin-amd64.sig
            bin/g8e-darwin-amd64.sha256
            bin/g8e-darwin-arm64
            bin/g8e-darwin-arm64.sig
            bin/g8e-darwin-arm64.sha256
            bin/g8e-windows-amd64.exe
            bin/g8e-windows-amd64.exe.sig
            bin/g8e-windows-arm64.exe
            bin/g8e-windows-arm64.exe.sig
            bin/checksums-sha256.txt

  verify-install:
    name: Verify Go Install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: release
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: false

      - name: Fresh go install
        run: |
          go install github.com/g8e-ai/g8e/cmd/g8e@v${{ needs.release.outputs.version }}
          g8e --version
          g8e --help
          echo "Fresh go install verified successfully"
