name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-lint:
    name: Verify & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        run: |
          wget https://go.dev/dl/go1.22.5.linux-amd64.tar.gz
          sudo rm -rf /usr/local/go
          sudo tar -C /usr/local -xzf go1.22.5.linux-amd64.tar.gz
          echo "/usr/local/go/bin" >> $GITHUB_PATH

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Install protoc-gen plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          go install github.com/pseudomuto/protoc-gen-doc/cmd/protoc-gen-doc@latest

      - name: Generate Proto
        run: make proto

      - name: Verify Constants
        run: |
          python3 scripts/data/generate_constants.py --all
          CHANGES=$(git status --porcelain | grep -E "^\s*M.*\.go$|^\s*M.*\.py$|^\s*M.*\.sh$" || true)
          if [ -n "$CHANGES" ]; then
            echo "Error: Generated constant files are out of sync with protocol/constants/*.json"
            echo "$CHANGES"
            git diff
            exit 1
          fi

      - name: Check for drift
        run: |
          CHANGES=$(git status --porcelain | grep -E "^\s*M.*\.pb\.go$|^\s*M.*_pb2.*\.py$|^\s*M.*\.proto$" || true)
          if [ -n "$CHANGES" ]; then
            echo "Error: Generated proto files are out of sync with protocol/proto/*.proto"
            echo "$CHANGES"
            git diff -- $(git status --porcelain | grep -E "^\s*M" | awk '{print $2}')
            exit 1
          fi

      - name: Lint no bare session_id
        run: make lint-no-bare-session-id

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run golangci-lint (g8eo)
        run: golangci-lint run --path-prefix=services/g8eo
        working-directory: services/g8eo

      - name: Run golangci-lint (protocol)
        run: golangci-lint run
        working-directory: protocol

      - name: Run Constants Lint
        run: go test -v -run TestNoRawStringLiteralsWhereConstantsExist ./internal/contracts
        working-directory: services/g8eo
        env:
          G8E_STRICT_CONSTANTS_LINT: "1"
        continue-on-error: true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        run: |
          wget https://go.dev/dl/go1.22.5.linux-amd64.tar.gz
          sudo rm -rf /usr/local/go
          sudo tar -C /usr/local -xzf go1.22.5.linux-amd64.tar.gz
          echo "/usr/local/go/bin" >> $GITHUB_PATH

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
        working-directory: services/g8eo

  test:
    name: Substrate Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        run: |
          wget https://go.dev/dl/go1.22.5.linux-amd64.tar.gz
          sudo rm -rf /usr/local/go
          sudo tar -C /usr/local -xzf go1.22.5.linux-amd64.tar.gz
          echo "/usr/local/go/bin" >> $GITHUB_PATH

      - name: Start Operator substrate
        run: ./g8e platform start

      - name: Test Operator substrate
        run: ./g8e test

      - name: Show Operator logs
        if: failure()
        run: tail -n 200 .g8e/logs/operator-listen.log || true

      - name: Stop platform
        if: always()
        run: ./g8e platform stop

