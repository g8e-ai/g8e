name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  onboarding:
    name: Fresh container onboarding
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dogfood setup and native startup as a new contributor
        run: |
          docker run --rm --init --volume "$PWD:/source:ro" ubuntu:24.04 bash -euc '
            set -o pipefail
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates git sudo
            useradd --create-home --shell /bin/bash contributor
            echo "contributor ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/contributor
            mkdir /workspace
            git -c safe.directory=/source -C /source archive HEAD | tar -x -C /workspace
            chown -R contributor:contributor /workspace
            su - contributor -c "cd /workspace && bash scripts/ci/onboarding-smoke.sh"
          '

  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true
          check-latest: true

      - name: Install dependencies
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.70.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          go install github.com/pseudomuto/protoc-gen-doc/cmd/protoc-gen-doc@v1.5.1
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/swaggo/swag/cmd/swag@latest

      - name: Install protoc
        run: |
          PROTOC_ZIP=protoc-35.0-linux-x86_64.zip
          curl -fSL https://github.com/protocolbuffers/protobuf/releases/download/v35.0/$PROTOC_ZIP -o /tmp/protoc.zip
          sudo unzip -o /tmp/protoc.zip -d /usr/local bin/protoc
          sudo chmod +x /usr/local/bin/protoc
          rm /tmp/protoc.zip

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: protocol/node/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python proto tools, uv, and script test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install grpcio-tools==1.84.0 uv==0.11.21 python-dotenv==1.2.3

      - name: Test developer setup and host launcher scripts
        run: python -m unittest discover -s scripts/tests -v

      - name: Verify Version Sync
        run: |
          VERSION=$(cat VERSION | tr -d '\n\r' | sed 's/^v//')
          PY_VERSION=$(grep -E '^version = ' protocol/python/pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          PY_INIT_VERSION=$(grep -E '^__version__ = ' protocol/python/g8e/__init__.py | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          PY_LOCK_VERSION=$(sed -n -E '/^name = "g8e"$/{n;s/^version = "([^"]+)"/\1/p;}' protocol/python/uv.lock)
          if [ "$PY_VERSION" != "$VERSION" ] || [ "$PY_INIT_VERSION" != "$VERSION" ] || [ "$PY_LOCK_VERSION" != "$VERSION" ]; then
            echo "Error: pyproject.toml ($PY_VERSION), __init__.py ($PY_INIT_VERSION), uv.lock ($PY_LOCK_VERSION) != VERSION ($VERSION)"
            exit 1
          fi
          for doc in a2a.md constants.md mcp.md spec.md; do
            DOC_VERSION=$(grep -E '^Version: v' "protocol/docs/$doc" | head -1 | sed 's/^Version: v//')
            if [ "$DOC_VERSION" != "$VERSION" ]; then
              echo "Error: protocol/docs/$doc ($DOC_VERSION) != VERSION ($VERSION)"
              exit 1
            fi
          done
          echo "Version sync OK: $VERSION"

      - name: Verify Proto & Doctrines
        run: |
          make proto-generate
          git diff --exit-code
          make doctrines-validate

      - name: Validate COSAiS Overlay Coverage
        run: make cosais-validate

      - name: Generate & Validate Swagger Docs
        run: |
          make swagger-generate
          git diff --exit-code internal/services/gateway/docs/

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Security Scan
        run: make vulncheck

      - name: Unit Tests
        run: make test-unit

      - name: Integration Tests
        run: make test-integration

      - name: Cross-Compile (Windows)
        run: make build-windows

      - name: Verify Static Linking
        run: |
          make build-linux
          file bin/g8e-linux-amd64 | grep -q "statically linked" || \
            { echo "ERROR: binary is not statically linked"; file bin/g8e-linux-amd64; exit 1; }
          ldd bin/g8e-linux-amd64 2>&1 | grep -q "not a dynamic executable" || \
            { echo "ERROR: binary has dynamic dependencies"; ldd bin/g8e-linux-amd64; exit 1; }

  python-tests:
    name: Python Package Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install package and test dependencies
        working-directory: protocol/python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" 2>/dev/null || pip install -e . pytest

      - name: Verify version
        run: |
          VERSION=$(cat VERSION | tr -d '\n\r' | sed 's/^v//')
          python -c "import g8e; assert g8e.__version__ == '$VERSION', f'Version mismatch: {g8e.__version__} != $VERSION'"
          echo "Python version sync OK: $VERSION"

      - name: Run pytest suite
        working-directory: protocol/python
        run: python -m pytest tests/ -v

      - name: Run examples (smoke test)
        run: |
          python examples/python/constants_example.py
          python examples/python/models_example.py

  python-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install package
        working-directory: protocol/python
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit --skip-editable

  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Python smoke test
        run: bash scripts/smoke-test-python.sh

      - name: Go smoke test
        run: bash scripts/smoke-test-go.sh

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.27.2/gitleaks_8.27.2_linux_x64.tar.gz | tar xz -C /tmp
          /tmp/gitleaks detect --source . --config .gitleaks.toml --verbose --no-banner

  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true

      - name: Install go-licenses
        run: go install github.com/google/go-licenses@latest

      - name: Generate license report
        run: |
          go-licenses report ./... > licenses.csv 2>/dev/null || true
          echo "License report generated"

      - name: Check for forbidden licenses
        run: |
          # g8e itself is licensed under BSL 1.1 (BUSL-1.1); allow it for our own module.
          # Forbid copyleft licenses (GPL/AGPL/LGPL/SSPL) and BUSL in dependencies.
          if grep -iE 'GPL|AGPL|LGPL|SSPL' licenses.csv; then
            echo "ERROR: Forbidden copyleft license detected"
            cat licenses.csv
            exit 1
          fi
          if grep -i 'BUSL' licenses.csv | grep -v 'github.com/g8e-ai/g8e'; then
            echo "ERROR: Forbidden BUSL license in dependency"
            cat licenses.csv
            exit 1
          fi
          echo "License compliance OK"

      - name: Check BSL 1.1 source headers
        run: make bsl-headers-check

  conformance:
    name: Protocol Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install package
        working-directory: protocol/python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run conformance tests
        run: python -m pytest protocol/conformance/ -v

  ensemble-tests:
    name: Ensemble (g8ee) Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true

      - name: Pre-build Go gateway harness
        run: go test -tags=integration -run '^$' ./internal/services/gateway/

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install in-tree protocol package
        working-directory: protocol/python
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install ensemble with test dependencies
        working-directory: ensemble
        run: |
          pip install -e ".[test]"

      - name: Generate protobuf stubs
        working-directory: ensemble
        run: make proto

      - name: Lint and typecheck ensemble
        run: make ensemble-lint

      - name: Run ensemble unit + in-process integration tests
        working-directory: ensemble
        run: python -m pytest tests/unit/ tests/integration/ -q -m "not ai_integration and not requires_web_search and not requires_api"

  console-tests:
    name: Console Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            console/package-lock.json
            g8e-adapter/package-lock.json
            evaluation-explorer/package-lock.json

      - name: Install dependencies
        working-directory: console
        run: npm ci

      - name: Typecheck and lint
        working-directory: console
        run: npm run typecheck && npm run lint

      - name: Run vitest suite
        working-directory: console
        run: npm test

      - name: Verify the embedded console is current
        run: |
          npm run build --prefix console
          diff -r console/dist internal/services/gateway/console/static || {
            echo "ERROR: The embedded console (internal/services/gateway/console/static) is stale."
            echo "Run 'make ci' (or 'make console-embed') locally and commit the refreshed embed."
            exit 1
          }

      - name: Verify the embedded explorer is current
        run: |
          npm ci --prefix evaluation-explorer
          npm run build --prefix evaluation-explorer
          diff -r evaluation-explorer/dist internal/services/gateway/explorer/static || {
            echo "ERROR: The embedded explorer (internal/services/gateway/explorer/static) is stale."
            echo "Run 'make ci' (or 'make explorer-embed') locally and commit the refreshed embed."
            exit 1
          }

      - name: Build g8e-adapter and verify its contract pack
        working-directory: g8e-adapter
        run: |
          npm ci
          npm run build
          npm run gen:contract-pack:check

  website-tests:
    name: Website Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Test and build
        working-directory: website
        run: npm run check && npm run build

      - name: Validate Cloudflare bundle
        working-directory: website
        run: npx wrangler deploy --dry-run
