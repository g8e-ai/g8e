name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify Code Generation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Install protoc-gen plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          go install github.com/pseudomuto/protoc-gen-doc/cmd/protoc-gen-doc@latest

      - name: Generate Proto
        run: make proto

      - name: Verify Constants
        run: |
          make constants
          CHANGES=$(git status --porcelain | grep -E "^\s*M.*\.go$|^\s*M.*\.py$|^\s*M.*\.sh$" || true)
          if [ -n "$CHANGES" ]; then
            echo "Error: Generated constant files are out of sync with protocol/constants/*.json"
            echo "$CHANGES"
            git diff
            exit 1
          fi

      - name: Check for drift
        run: |
          CHANGES=$(git status --porcelain | grep -E "^\s*M.*\.pb\.go$|^\s*M.*\.proto$" || true)
          if [ -n "$CHANGES" ]; then
            echo "Error: Generated proto files are out of sync with protocol/proto/*.proto"
            echo "$CHANGES"
            git diff -- $(git status --porcelain | grep -E "^\s*M" | awk '{print $2}')
            exit 1
          fi

      - name: Validate doctrine JSON schema
        run: make validate-doctrines

      - name: Check constants registry
        run: go run ./internal/constants/check_registry.go ./internal/constants

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

      - name: Lint no bare session_id
        run: make lint-no-bare-session-id

      - name: Constants lint
        run: go test -v -run TestNoRawStringLiteralsWhereConstantsExist ./internal/contracts
        env:
          G8E_STRICT_CONSTANTS_LINT: "1"
        continue-on-error: true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-default: true
          repo-checkout: false

  test:
    name: Substrate Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build CLI
        run: make build-cli

      - name: Run substrate tests
        run: make _ci-test-g8eo

      - name: Show Operator logs
        if: failure()
        run: tail -n 200 .g8e/logs/operator-listen.log || true

  test-scenarios:
    name: Scenario Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run scenario integration tests
        run: go test -tags=integration -v -run TestScenarios ./test/scenario/...

  docs:
    name: Check Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build CLI reference
        run: make docs-cli

      - name: Check for CLI documentation drift
        run: |
          CHANGES=$(git status --porcelain | grep -E "^\s*M.*docs/guides/cli\.md$" || true)
          if [ -n "$CHANGES" ]; then
            echo "Error: CLI documentation is out of sync with CLI help output"
            echo "$CHANGES"
            git diff docs/guides/cli.md
            exit 1
          fi

      - name: Build documentation
        run: make docs-build
