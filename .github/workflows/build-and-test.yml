name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-proto:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Install protoc-gen plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          go install pseudomuto/protoc-gen-doc/cmd/protoc-gen-doc@latest

      - name: Generate Proto
        run: make proto

      - name: Verify Constants
        run: |
          make constants
          CHANGES=$(git status --porcelain | grep -E "^\s*M.*\.go$|^\s*M.*\.py$|^\s*M.*\.sh$" || true)
          if [ -n "$CHANGES" ]; then
            echo "Error: Generated constant files are out of sync with protocol/constants/*.json"
            echo "$CHANGES"
            git diff
            exit 1
          fi

      - name: Check for drift
        run: |
          # Only check for changes in generated proto files, ignore untracked files
          CHANGES=$(git status --porcelain | grep -E "^\s*M.*\.pb\.go$|^\s*M.*\.proto$" || true)
          if [ -n "$CHANGES" ]; then
            echo "Error: Generated proto files are out of sync with protocol/proto/*.proto"
            echo "$CHANGES"
            git diff -- $(git status --porcelain | grep -E "^\s*M" | awk '{print $2}')
            exit 1
          fi

      - name: Lint no bare session_id
        run: make lint-no-bare-session-id

      - name: Validate doctrine JSON schema
        run: make validate-doctrines

      - name: Check constants registry
        run: go run ./internal/constants/check_registry.go

  lint-g8eo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install tools
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          go install gotest.tools/gotestsum@latest

      - name: Run golangci-lint (g8eo)
        run: golangci-lint run

  vulncheck-g8eo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  test-g8eo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build unified g8eo binary
        run: make build-cli

      - name: Start Operator Gateway
        run: ./g8e platform start

      - name: Test Operator Gateway
        run: |
          GOMAXPROCS=4 gotestsum --format testname -- -race -p 4 -timeout 180s ./...

      - name: Check coverage
        run: |
          GOMAXPROCS=4 go test -race -p 4 -timeout 180s -coverprofile=coverage.out -covermode=atomic ./...
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          if [ $(echo "$COVERAGE < 85" | bc -l) -eq 1 ]; then
            echo "Coverage $COVERAGE% is below 85% threshold"
            exit 1
          fi
          echo "Coverage $COVERAGE% meets 85% threshold"

      - name: Show Operator logs
        if: failure()
        run: tail -n 200 .g8e/logs/operator-listen.log || true

      - name: Stop platform
        if: always()
        run: ./g8e platform stop

  test-scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run scenario integration tests
        run: |
          go test -tags=integration -v -run TestScenarios ./test/scenario/...

  constants-lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run Constants Lint
        run: go test -v -run TestNoRawStringLiteralsWhereConstantsExist ./internal/contracts
        env:
          G8E_STRICT_CONSTANTS_LINT: "1"

  docs-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build CLI reference
        run: make docs-cli

      - name: Check for CLI documentation drift
        run: |
          CHANGES=$(git status --porcelain | grep -E "^\s*M.*docs/guides/cli\.md$" || true)
          if [ -n "$CHANGES" ]; then
            echo "Error: CLI documentation is out of sync with CLI help output"
            echo "$CHANGES"
            git diff docs/guides/cli.md
            exit 1
          fi

      - name: Build documentation
        run: make docs-build

