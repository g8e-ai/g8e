name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: true
          check-latest: true

      - name: Install dependencies
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.70.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          go install github.com/pseudomuto/protoc-gen-doc/cmd/protoc-gen-doc@v1.5.1
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/swaggo/swag/cmd/swag@latest

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: |
          PROTOC_ZIP=protoc-35.0-linux-x86_64.zip
          curl -fSL https://github.com/protocolbuffers/protobuf/releases/download/v35.0/$PROTOC_ZIP -o /tmp/protoc.zip
          sudo unzip -o /tmp/protoc.zip -d /usr/local bin/protoc
          sudo chmod +x /usr/local/bin/protoc
          rm /tmp/protoc.zip

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: |
          PROTOC_ZIP=protoc-35.0-osx-aarch_64.zip
          curl -fSL https://github.com/protocolbuffers/protobuf/releases/download/v35.0/$PROTOC_ZIP -o /tmp/protoc.zip
          sudo unzip -o /tmp/protoc.zip -d /usr/local bin/protoc
          sudo chmod +x /usr/local/bin/protoc
          rm /tmp/protoc.zip

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          PROTOC_ZIP=protoc-35.0-win64.zip
          curl -fSL https://github.com/protocolbuffers/protobuf/releases/download/v35.0/$PROTOC_ZIP -o /tmp/protoc.zip
          unzip -o /tmp/protoc.zip -d "$HOME/protoc" bin/protoc
          echo "$HOME/protoc/bin" >> $GITHUB_PATH
          rm /tmp/protoc.zip

      - name: Verify Version Sync
        run: |
          VERSION=$(cat VERSION | tr -d '\n' | sed 's/^v//')
          PY_VERSION=$(grep -E '^version = ' protocol/python/pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          PY_INIT_VERSION=$(grep -E '^__version__ = ' protocol/python/g8e/__init__.py | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$PY_VERSION" != "$VERSION" ] || [ "$PY_INIT_VERSION" != "$VERSION" ]; then
            echo "Error: pyproject.toml ($PY_VERSION), __init__.py ($PY_INIT_VERSION) != VERSION ($VERSION)"
            echo "Run 'make release' to sync."
            exit 1
          fi
          echo "Version sync OK: $VERSION"

      - name: Verify Proto & Doctrines
        run: |
          make proto
          git diff --exit-code
          make validate-doctrines

      - name: Generate & Validate Swagger Docs
        run: |
          make swagger-generate
          git diff --exit-code internal/services/gateway/docs/

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Security Scan
        run: make vulncheck

      - name: Unit Tests
        run: make test-unit

      - name: Integration Tests
        run: make test-integration

      - name: Cross-Compile (Windows)
        if: runner.os == 'Linux'
        run: make build-windows

  python-tests:
    name: Python Package Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install package and test dependencies
        working-directory: protocol/python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" 2>/dev/null || pip install -e . pytest

      - name: Verify version
        run: |
          VERSION=$(cat VERSION | tr -d '\n' | sed 's/^v//')
          python -c "import g8e; assert g8e.__version__ == '$VERSION', f'Version mismatch: {g8e.__version__} != $VERSION'"
          echo "Python version sync OK: $VERSION"

      - name: Run pytest suite
        working-directory: protocol/python
        run: python -m pytest tests/ -v

      - name: Run examples (smoke test)
        working-directory: protocol/python
        run: |
          python examples/constants_example.py
          python examples/models_example.py

  python-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install package
        working-directory: protocol/python
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit --strict

  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Python smoke test
        run: bash scripts/smoke-test-python.sh

      - name: Go smoke test
        run: bash scripts/smoke-test-go.sh

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: true

      - name: Install go-licenses
        run: go install github.com/google/go-licenses@latest

      - name: Generate license report
        run: |
          go-licenses report ./... > licenses.csv 2>/dev/null || true
          echo "License report generated"

      - name: Check for forbidden licenses
        run: |
          if grep -iE 'GPL|AGPL|LGPL|SSPL|BUSL' licenses.csv; then
            echo "ERROR: Forbidden copyleft license detected"
            cat licenses.csv
            exit 1
          fi
          echo "License compliance OK"

  conformance:
    name: Protocol Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install package
        working-directory: protocol/python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run conformance tests
        run: python -m pytest protocol/conformance/ -v
