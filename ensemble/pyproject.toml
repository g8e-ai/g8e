[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "g8ee"
version = "0.2.6"
description = "g8e-Compliant Agentic Ensemble (g8ee) - Reference AI reasoning system for g8e infrastructure operations"
requires-python = ">=3.12"
license = {text = "BUSL-1.1"}
dependencies = [
    # HTTP server
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    # Data validation and modeling
    "pydantic==2.13.4",
    # Async HTTP and TLS
    "aiohttp==3.14.3",
    "httpx==0.28.1",
    "cryptography==50.0.1",
    # Protocol Buffers (runtime parsing + build-time stub generation)
    "protobuf==7.36.2",
    "grpcio-tools==1.84.0",
    # g8e Protocol Library (in-tree, monorepo model — see [tool.uv.sources]
    # for the local path override; the Dockerfile installs protocol/python
    # before ensemble so pip resolves g8e from the already-installed local
    # package instead of PyPI)
    "g8e>=2.1.8",
    # LLM providers
    "openai==3.14.1",
    "ollama==0.6.2",
    "google-genai==2.24.0",
    "anthropic==1.5.0",
    # Retry primitives
    "tenacity==9.1.4",
    # Vertex AI Search grounding
    "google-cloud-discoveryengine==0.20.4",
    # Documentation
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5.0",
    "python-dotenv==1.2.3",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=6.0.0",
]
dev = [
    "ruff==0.16.8",
    "pyright==1.1.414",
    "pre-commit>=3.0.0",
]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "pytest-timeout>=2.4.0",
    "pytest-xdist[psutil]>=3.8.0",
    "ruff==0.16.8",
    "pyright==1.1.414",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.28.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "config*", "reports*"]

[tool.setuptools.package-data]
"app.constants" = ["api_paths.json"]

# ============================================================================
# UV Sources — monorepo local path override for the in-tree g8e protocol
# package. When the ensemble is installed with uv (development), the `g8e`
# dependency resolves to ../protocol/python instead of PyPI. The Dockerfile
# installs protocol/python first with pip so the same resolution happens in
# the container image.
# ============================================================================
[tool.uv.sources]
g8e = { path = "../protocol/python" }

# ============================================================================
# Pytest Configuration
# ============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]

# Async configuration
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

# Test markers for categorization
markers = [
    "unit: Unit tests (fast, isolated, no external dependencies)",
    "integration: Integration tests (may require external services)",
    "ai_integration: Tier 4 (External) — tests requiring real LLM API calls",
    "slow: Tests that take longer than 1 second",
    "requires_web_search: Tier 4 (External) — tests requiring web search configuration (search.enabled, project_id, engine_id, api_key)",
    "e2e: End-to-end tests (full application flow)",
    "smoke: Quick smoke tests for CI",
    "ai: Tests involving AI/LLM functionality",
    "aws: Tests requiring LocalStack AWS emulation",
    "intent_workflow: Tests for intent-based permission workflow with g8eEnsemble",
    "requires_api: Tier 4 (External) — tests requiring a live external API (e.g. Google Search API)",
    "requires_system_one: Tier 4 (External) — tests requiring a reachable Ollama (0.35+) with the nimble System One model pulled",
    "thinking: Tests requiring LLM thinking/reasoning capability",
    "tools: Tests requiring LLM tool calling/function calling capability",
    "operator_wire: Integration tests that publish tool-call events directly to a live Operator via PubSub (no AI, no approval gate)",
    "requires_operator: Integration tests that require a live g8e Gateway (e.g. for DB or KV access)",
]

# Output and logging
addopts = [
    "--tb=short",
    "--no-header",
    "--strict-markers",
    "--strict-config",
    "-q",
    "-rs",
]


# Warning filters - treat all warnings as errors except SDK-internal issues
filterwarnings = [
    "error",
    "ignore:Inheritance class .* from ClientSession is discouraged:DeprecationWarning:aiohttp.client",
    "ignore:Unclosed client session:ResourceWarning",
    "ignore:Unclosed connector:ResourceWarning",
    "ignore:unclosed transport:ResourceWarning",
    "ignore:unclosed <socket.socket:ResourceWarning",
]

# Timeout for tests (prevents hanging)
timeout = 60

# ============================================================================
# Coverage Configuration
# ============================================================================
[tool.coverage.run]
data_file = ".coverage"
source = ["app"]
branch = true
parallel = true
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/__main__.py",
    "*/conftest.py",
    "*/.pytest_cache/*",
    "*/site-packages/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
skip_empty = true
sort = "Cover"
exclude_lines = [
    "pragma: no cover",
    "def __str__",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "class .*\\bProtocol\\):",
]

# Terminal output formatting
[tool.coverage.term]
show_missing = true
skip_covered = false
skip_empty = true

[tool.coverage.html]
directory = "coverage-reports/g8ee"
title = "g8ee Test Coverage"

[tool.coverage.json]
output = "coverage-reports/g8ee/coverage.json"

# ============================================================================
# Ruff Configuration (Linter & Formatter)
# ============================================================================
[tool.ruff]
target-version = "py312"
line-length = 100
indent-width = 4
cache-dir = ".ruff_cache"

[tool.ruff.lint]
select = [
        "E",      # pycodestyle errors
        "W",      # pycodestyle warnings
        "F",      # pyflakes
        "I",      # isort
        "N",      # pep8-naming
        "UP",     # pyupgrade
        "YTT",    # flake8-2020
        "ASYNC",  # flake8-async
        "B",      # flake8-bugbear
        "A",      # flake8-builtins
        "C4",     # flake8-comprehensions
        "DTZ",    # flake8-datetimez
        "T10",    # flake8-debugger
        "ISC",    # flake8-implicit-str-concat
        "ICN",    # flake8-import-conventions
        "G",      # flake8-logging-format
        "PIE",    # flake8-pie
        "T20",    # flake8-print
        "PT",     # flake8-pytest-style
        "Q",      # flake8-quotes
        "RSE",    # flake8-raise
        "RET",    # flake8-return
        "SLF",    # flake8-self
        "SIM",    # flake8-simplify
        "TID",    # flake8-tidy-imports
        "ARG",    # flake8-unused-arguments
        "PTH",    # flake8-use-pathlib
        "ERA",    # eradicate
        "PL",     # pylint
        "PERF",   # perflint
        "RUF",    # ruff-specific rules
    ]
ignore = [
    "E501",    # Line length is a formatter policy; long URLs and prose are allowed.
    "PLR0913", # Service interfaces use explicit named parameters; no fixed arity limit.
    "PLR0917", # Same interface policy for positional parameter counts.
    "PLR2004", # Numeric literals do not universally require named constants.
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI evaluates these declarations as request dependencies, not ordinary defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "SLF001", # Tests exercise internal behavior directly.
    "ARG001", # Injected fixtures can be used for their setup side effects.
    "ARG002", # Test methods and fakes can require unused interface parameters.
    "RUF012", # Pytest class attributes declare shared fixture/test data.
]
"**/__init__.py" = [
    "F401", # Package initializers expose imports as their public API.
]
"app/constants/config.py" = ["F401"] # Compatibility re-exports.
"app/constants/platform.py" = ["F401"] # Compatibility re-exports.
"app/constants/generated_status.py" = ["F401"] # Generated protocol enum re-exports.
"app/constants/generated_paths.py" = ["F401"] # Generated protocol path re-exports.
"app/models/events.py" = ["F401"] # Compatibility event payload re-exports.

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

