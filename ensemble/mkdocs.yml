# g8ee Documentation Configuration
# See https://www.mkdocs.org/user-guide/configuration/

site_name: g8ee Documentation
site_description: g8e-Compliant Agentic Ensemble - Reference AI reasoning system for g8e infrastructure operations
site_author: Lateralus Labs, LLC

repo_url: https://github.com/g8e-ai/g8e
repo_name: g8e

# Docs now live at the repo root in docs/ensemble/
docs_dir: ../docs/ensemble

# Navigation structure
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Governance: governance.md
  - Agents: agents.md
  - Protocol: protocol.md
  - Prompts: prompts.md
  - Thinking: thinking.md
  - PKI & Trust: pki.md
  - Storage: storage.md
  - LLM Providers: llm-providers.md
  - Development: devs.md
  - Testing: tests.md
  - Evals: evals.md
  - Constants: constants.md

# Theme configuration
theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

# Plugins
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_members_full_path: false

# Extensions
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

