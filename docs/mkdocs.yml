site_name: g8e Documentation
site_description: Zero-trust execution substrate for agentic infrastructure
site_author: g8e.ai
site_url: https://docs.g8e.ai

docs_dir: .
site_dir: ../site

# Repository
repo_name: g8e-ai/g8e
repo_url: https://github.com/g8e-ai/g8e

# Copyright
copyright: Copyright &copy; 2026 Lateralus Labs, LLC

# Theme
theme:
  name: material
  palette:
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
  font:
    text: false
    code: false

# Plugins
plugins:
  - search:
      lang: en

# Extensions
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

# Navigation
nav:
  - Home: index.md
  - Architecture:
      - About: architecture/about.md
      - Position Paper: reference/position_paper.md
      - Operator: architecture/operator.md
      - Governance Gateway: architecture/gateway.md
  - Protocols:
      - g8e Protocol: architecture/protocol.md
      - MCP Protocol: protocols/mcp/mcp.md
      - A2A Protocol: protocols/a2a/a2a.md
  - Guides:
      - Getting Started: guides/getting_started.md
      - Build Gateway: guides/build_gateway.md
      - Connect Apps to Gateway: guides/connect_apps_to_gateway.md
      - Build Operator: guides/build_operator.md
      - Connect Operator to Gateway: guides/connect_operator_to_gateway.md
      - Build Apps: guides/build_apps.md
      - Air Gap: guides/air_gap.md
  - Reference:
      - API: reference/api/index.md
      - Constants: reference/constants.md
      - Glossary: reference/glossary.md
  - Developer:
      - Developer Guidelines: devs/devs.md
      - CLI Reference: devs/cli.md
      - Testing: devs/tests.md
      - Troubleshooting: devs/troubleshooting.md
      - Codemap: codemap.md
  - External:
      - A2A Protocol (JSON Schema): protocols/a2a/a2a.json
      - A2A Protocol (Proto): protocols/a2a/a2a.proto
