syntax = "proto3";

package anduril.entitymanager.v1;

option csharp_namespace = "Anduril.Entitymanager.V1";
option go_package = "github.com/g8e-ai/g8e/v2/internal/adapters/lattice/gen/anduril/entitymanager/v1;entitymanager";
option java_multiple_files = true;
option java_outer_classname = "SymbologyProto";
option java_package = "com.anduril.entitymanager.v1";
option objc_class_prefix = "AEX";

// Symbology associated with an entity.
message Symbology {
  oneof standard {
    MilStd2525C mil_std_2525_c = 1;
  }
}

message MilStd2525C {
  string sidc = 1;
}
