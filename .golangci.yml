version: "2"
run:
  allow-parallel-runners: true
  timeout: 5m
  tests: true
  build-tags:
    - integration
linters:
  default: none
  enable:
    # Core Go checks (from official Go analysis framework)
    - govet
    - ineffassign
    - staticcheck
    - unused
    - errcheck
    
    # Style & Complexity (relaxed for gradual compliance)
    # - gocritic  # Disabled for gradual compliance (237 issues)
    # - goconst  # Disabled for gradual compliance (192 issues)
    - gocyclo
    - misspell
    - unconvert
    - whitespace
    # - nolintlint  # Disabled pending removal of redundant G115 directives (46 issues)
    # - unparam  # Disabled for gradual compliance (27 issues)
    
    # Bug Prevention
    - bodyclose
    - nilnesserr
    - durationcheck
    - reassign
    - makezero
    - sqlclosecheck
    - rowserrcheck
    - wastedassign
    - fatcontext
    - recvcheck
    - mirror
    - musttag
    # - contextcheck  # Disabled for gradual compliance (9 issues)
    - copyloopvar
    - usestdlibvars
    - nilerr
    - nolintlint
    - sloglint
    - gosec
    
    # Test Helpers (relaxed for gradual compliance)
    # - testifylint  # Disabled for gradual compliance (157 style issues - code is functionally correct)
    # - thelper  # Disabled for gradual compliance (62 issues)
    # - paralleltest  # Disabled for gradual compliance (1490 issues)
    
    # Performance
    # - prealloc  # Disabled for gradual compliance (6 issues)
  settings:
    gocritic:
      disabled-checks:
        - appendCombine
        - commentedOutCode
        - emptyStringTest
        - equalFold
        - ifElseChain
        - importShadow
        - newDeref
        - paramTypeCombine
        - ptrToRefParam
        - rangeValCopy
        - sloppyReassign
        - switchTrue
        - typeAssertChain
        - underef
        - unlambda
        - unnecessaryBlock
        - weakCond
      enabled-tags:
        - diagnostic
        - performance
        - experimental
        - style
        - opinionated
    gosec:
      excludes:
        - G104 # Unchecked errors (handled by errcheck)
        - G101 # False positives on constant names containing "key" / "token"
        - G204 # Subprocess exec with variable (common across CLI tools)
        - G306 # File permissions (covered by project Perm* constants)
        - G703 # Path traversal taint false positives
        - G107 # HTTP request URL taint false positives
        - G115 # Integer overflow conversion
    govet:
      disable:
        - fieldalignment
        - shadow
        - unusedwrite
      enable-all: true
    gocyclo:
      min-complexity: 60
    nolintlint:
      require-explanation: true
      require-specific: true
    goconst:
      min-len: 5
      min-occurrences: 5
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gocritic
          - gosec
          - unused
        path: _test\.go
      - linters:
          - gosec
        path: internal/cli/stream/proxy_command_unix\.go
        text: G702
      - linters:
          - recvcheck
        path: internal/constants/operator_roles\.go
      - linters:
          - bodyclose
        path: internal/testutil/pubsub\.go
        text: Dial
      - linters:
          - gosec
        path: internal/services/vault/vault_crypto\.go
        text: G115
      - linters:
          - gosec
        path: internal/cli/cmd/auth/auth_context\.go
        text: G117
      - linters:
          - unparam
        path: _test\.go
      - linters:
          - whitespace
        path: _test\.go
      - linters:
          - goconst
        path: _test\.go
      - linters:
          - gocyclo
        path: internal/services/compliance/evidence/operational_importer\.go
    paths:
      - third_party$
      - builtin$
      - examples$
      - vendor$
      - node_modules
      - \.local\.dev
      - protocol/docs/mcp_tool_template\.go$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - vendor$
      - node_modules
      - \.local\.dev
      - protocol/docs/mcp_tool_template\.go$
