linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment
      - shadow # extremely common in Go (if err := ...)
  gosec:
    excludes:
      - G104 # errcheck already handles this
  gocritic:
    enabled-tags:
      - diagnostic
      - performance
    disabled-checks:
      - appendCombine # too noisy for generated code/exporters

linters:
  disable-all: true
  enable:
    - bodyclose
    - errcheck
    - gofmt
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unconvert
    - unused
    - misspell

run:
  timeout: 5m
  modules-download-mode: readonly
  allow-parallel-runners: true

issues:
  exclude-use-default: true
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
        - govet
        - unused
        - gocritic
    - path: cmd/exporter/main\.go
      linters:
        - gosec
      text: "G304" # Exporter legitimately reads files from paths provided in variables
    - path: internal/testutil/pubsub\.go
      linters:
        - bodyclose
      text: "Dial" # False positive: websocket Dial returns conn, not http response needing close
    - path: tests/byo_client_test\.go
      linters:
        - bodyclose
      text: "Dial" # False positive: websocket Dial returns conn, not http response needing close
    - path: internal/services/vault/vault_crypto\.go
      linters:
        - gosec
      text: "G115" # crypto block indexing conversions are safe

