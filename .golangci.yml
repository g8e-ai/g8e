version: "2"
run:
  modules-download-mode: readonly
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused
  settings:
    gocritic:
      disabled-checks:
        - appendCombine
      enabled-tags:
        - diagnostic
        - performance
    gosec:
      excludes:
        - G104
    govet:
      disable:
        - fieldalignment
        - shadow
      enable-all: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gocritic
          - gosec
          - govet
          - unused
        path: _test\.go
      - linters:
          - gosec
        path: cmd/exporter/main\.go
        text: G304
      - linters:
          - bodyclose
        path: internal/testutil/pubsub\.go
        text: Dial
      - linters:
          - bodyclose
        path: tests/byo_client_test\.go
        text: Dial
      - linters:
          - gosec
        path: internal/services/vault/vault_crypto\.go
        text: G115
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
