version: "2"
run:
  allow-parallel-runners: true
  timeout: 5m
  tests: true
  build-tags:
    - integration
linters:
  default: none
  enable:
    # Core Go checks (from official Go analysis framework)
    - govet
    - ineffassign
    - staticcheck
    - unused
    - errcheck
    
    # Style & Complexity (relaxed for gradual compliance)
    # - gocritic  # Disabled for gradual compliance (237 issues)
    # - goconst  # Disabled for gradual compliance (192 issues)
    - gocyclo
    - misspell
    - unconvert
    # - unparam  # Disabled for gradual compliance (27 issues)
    # - whitespace  # Disabled for gradual compliance (1 issue)
    
    # Bug Prevention
    - bodyclose
    # - contextcheck  # Disabled for gradual compliance (9 issues)
    # - copyloopvar  # Disabled for gradual compliance (14 issues)
    # - errorlint  # Disabled for gradual compliance (43 issues)
    # - nilerr  # Disabled for gradual compliance (16 issues)
    # - rowserrcheck  # Disabled for gradual compliance (9 issues)
    # - sqlclosecheck  # Disabled for gradual compliance (2 issues)
    
    # Security
    - gosec
    
    # Test Helpers (relaxed for gradual compliance)
    # - testifylint  # Disabled for gradual compliance (157 style issues - code is functionally correct)
    # - thelper  # Disabled for gradual compliance (62 issues)
    # - paralleltest  # Disabled for gradual compliance (1490 issues)
    
    # Performance
    # - prealloc  # Disabled for gradual compliance (6 issues)
  settings:
    gocritic:
      disabled-checks:
        - appendCombine
        - commentedOutCode
        - emptyStringTest
        - equalFold
        - ifElseChain
        - importShadow
        - newDeref
        - paramTypeCombine
        - ptrToRefParam
        - rangeValCopy
        - sloppyReassign
        - switchTrue
        - typeAssertChain
        - underef
        - unlambda
        - unnecessaryBlock
        - weakCond
      enabled-tags:
        - diagnostic
        - performance
        - experimental
        - style
        - opinionated
    gosec:
      excludes:
        - G104
        - G101
        - G204
        - G306
        - G402
        - G703
        - G107
        - G115
        - G102
        - G123
        - G702
        - G706
    govet:
      disable:
        - fieldalignment
        - shadow
      enable-all: true
    gocyclo:
      min-complexity: 60
    goconst:
      min-len: 5
      min-occurrences: 5
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gocritic
          - gosec
          - govet
          - unused
        path: _test\.go
      - linters:
          - bodyclose
        path: internal/testutil/pubsub\.go
        text: Dial
      - linters:
          - bodyclose
        path: tests/byo_client_test\.go
        text: Dial
      - linters:
          - gosec
        path: internal/services/vault/vault_crypto\.go
        text: G115
      - linters:
          - unparam
        path: _test\.go
      - linters:
          - whitespace
        path: _test\.go
      - linters:
          - goconst
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
      - docs/protocols/mcp/tool_template\.go$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - docs/protocols/mcp/tool_template\.go$
