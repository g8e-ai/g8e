<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="g8e - Zero-Trust AI for Real Production">
    <meta name="robots" content="noindex, nofollow">
    <title>g8e</title>
    <base href="/">

    <!-- Gateway origin for browser-direct WebAuthn + API calls. Override per
         deployment via G8E_GATEWAY_URL at build/runtime if needed. -->
    <script>window.G8E_GATEWAY_URL = window.G8E_GATEWAY_URL || "https://localhost:8443";</script>

    <link rel="stylesheet" href="/css/fonts.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/navigation.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/modals.css">
    <link rel="stylesheet" href="/css/system-notifications.css">
    <link rel="stylesheet" href="/css/landing.css">
    <link rel="stylesheet" href="/css/auth.css">

    <link rel="icon" type="image/png" href="/media/dropops.ai.logo.tiny.png">

    <!-- Dev logs bootstrap — defaults to false for the static SPA host; the
         gateway does not inject server-side user preferences. -->
    <script>window.__DEV_LOGS_ENABLED = false;</script>

    <!-- Theme Manager - must load before all other scripts -->
    <script src="/js/utils/theme-manager.js"></script>
    <!-- ServiceClient - must load before the nav inline module (auth.js init) -->
    <script type="module" src="/js/utils/service-client.js"></script>
</head>

<body data-theme="dark">
    <header class="landing-header">
        <div class="header-left">
            <div class="hamburger-menu nav-hamburger">
                <button id="hamburger-btn" class="hamburger-btn" aria-label="Menu">
                    <span class="material-symbols-outlined">description</span>
                </button>
                <div id="hamburger-dropdown" class="hamburger-dropdown">
                    <a href="/" class="hamburger-menu-item active">Home</a>
                    <a href="/docs" class="hamburger-menu-item">Docs</a>
                    <a href="https://github.com/dropops-ai/dropops" target="_blank" rel="noopener noreferrer" class="hamburger-menu-item">GitHub</a>
                    <div class="hamburger-menu-divider"></div>
                    <button id="hamburger-theme-toggle" class="hamburger-menu-item hamburger-theme-toggle">
                        <span>Go Light</span>
                    </button>
                </div>
            </div>
            <a href="/" class="nav-logo-link">
                <img src="/media/dropops-logo-vector.png" alt="g8e Logo" width="44" height="44" class="logo-icon">
            </a>
        </div>
        <div class="nav-categories-menu" id="nav-categories-menu">
            <a href="/" class="nav-category-link">Home</a>
            <a href="/docs" class="nav-category-link">Docs</a>
            <a href="https://github.com/dropops-ai/dropops" target="_blank" rel="noopener noreferrer" class="nav-category-link">GitHub</a>
        </div>
        <nav class="header-nav">
            <div id="auth-button-container" class="nav-auth-container">
            </div>
        </nav>
    </header>

    <main class="login-section">
        <div class="login-body-content">
            <div class="login-flow">
                <img src="/media/dropops-logo-vector.png" alt="g8e Logo" class="login-logo-img">
                <div class="login-flow-node login-flow-browser login-flow-row2">
                    <span class="material-symbols-outlined">terminal</span>
                    <span>Your Browser</span>
                </div>
                <div class="login-flow-arrow login-flow-row2">
                    <span class="material-symbols-outlined">arrow_forward</span>
                </div>
                <div class="login-flow-node login-flow-platform login-flow-row2">
                    <span class="material-symbols-outlined">hub</span>
                    <span>g8e Gateway</span>
                </div>
                <div class="login-flow-arrow login-flow-row2">
                    <span class="material-symbols-outlined">arrow_back</span>
                </div>
                <div class="login-flow-node login-flow-operator login-flow-row2">
                    <span class="material-symbols-outlined">dns</span>
                    <span>Bound Operator</span>
                </div>
            </div>
        </div>
    </main>

    <footer class="app-footer">
        <div class="footer-content">
            <div class="footer-copyright">
                <a href="https://dropops.ai" class="footer-link">g8e © 2026 Lateralus Labs, LLC</a>
            </div>
            <div class="footer-links">
                <a href="/docs" class="footer-link">Docs</a>
                <a href="/security" class="footer-link">Security</a>
            </div>
        </div>
    </footer>

    <!-- app.js creates the single AuthManager instance (window.authState) on
         DOMContentLoaded, validates the gateway session cookie, and renders
         either the profile dropdown or the sign-in button into
         #auth-button-container. error-handler and hamburger-menu are
         independent utilities loaded as modules. -->
    <script type="module" src="/js/utils/error-handler.js"></script>
    <script type="module" src="/js/components/hamburger-menu.js"></script>
    <script type="module" src="/js/app.js"></script>
</body>

</html>
