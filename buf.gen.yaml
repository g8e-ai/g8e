version: v2
plugins:
  # Go generation
  - local: protoc-gen-go
    out: protocol/proto
    opt:
      - paths=source_relative
  # gRPC Go generation
  - local: protoc-gen-go-grpc
    out: protocol/proto
    opt:
      - paths=source_relative
  # Markdown documentation generation
  - local: protoc-gen-doc
    out: docs/reference/api
    opt:
      - markdown,index.md
