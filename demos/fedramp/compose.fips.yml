name: g8e-fedramp-fips

services:
  gateway:
    build:
      context: ..
      dockerfile: Dockerfile.fips
    container_name: g8e-fedramp-fips-gateway
    hostname: gateway
    volumes:
      - fedramp-fips-gateway-state:/root/.g8e
      - ./doctrine:/etc/g8e/doctrine:ro
      - ./config/consensus-bootstrap.json:/etc/g8e/consensus-bootstrap.json:ro
      - ./cloudop.sh:/usr/local/bin/cloudop:ro
    ports:
      - "8089:8080"
      - "8452:8443"
    networks:
      net_perimeter:
        ipv4_address: 10.71.0.10
      net_internal:
        ipv4_address: 10.72.0.10
      net_secure:
        ipv4_address: 10.73.0.10
    working_dir: /root
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - G8E_GATEWAY_POSTURE=${G8E_GATEWAY_POSTURE:-consensus}
    entrypoint: []
    command: ["sh", "-c", "exec /g8e gw start -f --posture $${G8E_GATEWAY_POSTURE} --consensus-id fedramp-consensus --consensus-bootstrap /etc/g8e/consensus-bootstrap.json --doctrine-dir /etc/g8e/doctrine --public-base-url https://localhost:8452 --passkey-rp-origin http://localhost:8089 --passkey-rp-origin https://localhost:8452"]

  operator:
    build:
      context: ..
      dockerfile: Dockerfile.fips
    container_name: g8e-fedramp-fips-operator
    hostname: operator
    volumes:
      - fedramp-fips-operator-state:/root/.g8e
      - ./cloudop.sh:/usr/local/bin/cloudop:ro
    networks:
      net_internal:
        ipv4_address: 10.72.0.20
      net_secure:
        ipv4_address: 10.73.0.20
    extra_hosts:
      - "g8e.local:10.72.0.10"
    depends_on:
      gateway:
        condition: service_healthy
    working_dir: /root
    healthcheck:
      test: ["CMD", "test", "-f", "/root/.g8e/pki/operator.crt"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: ["operator", "start", "-e", "10.72.0.10", "--execution-vault"]

  agent-runtime:
    build:
      context: ..
      dockerfile: Dockerfile.fips
    container_name: g8e-fedramp-fips-agent
    hostname: agent-runtime
    entrypoint: ["sh", "-c", "sleep infinity"]
    volumes:
      - fedramp-fips-operator-state:/root/.g8e:ro
      - ./config/ensemble-seed.hex:/etc/g8e/ensemble-seed.hex:ro
      - ./config/consensus-bootstrap.json:/etc/g8e/consensus-bootstrap.json:ro
    networks:
      net_internal:
        ipv4_address: 10.72.0.30
    extra_hosts:
      - "g8e.local:10.72.0.10"
    depends_on:
      gateway:
        condition: service_healthy
      operator:
        condition: service_healthy
    working_dir: /root

  cloudsvc:
    image: python@sha256:b27df5841f3355e9473f9a516d38a6783b6c8dfeacaf2d14a240f443b368ddb6
    container_name: g8e-fedramp-fips-cloudsvc
    hostname: cloudsvc
    working_dir: /app
    command: ["python", "/app/cloudsvc.py"]
    volumes:
      - fedramp-fips-cloudsvc-data:/var/cloudsvc
      - ./cloudsvc.py:/app/cloudsvc.py:ro
      - ./verify_ops.py:/app/verify_ops.py:ro
    networks:
      net_secure:
        ipv4_address: 10.73.0.50
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/health')"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  bad-actor:
    image: alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    container_name: g8e-fedramp-fips-bad-actor
    hostname: bad-actor
    entrypoint: ["sh", "-c", "sleep infinity"]
    networks:
      net_untrusted:
        ipv4_address: 10.70.0.50

  observability:
    image: alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    container_name: g8e-fedramp-fips-observability
    hostname: observability
    entrypoint: ["sh", "-c", "sleep infinity"]
    volumes:
      - fedramp-fips-gateway-state:/var/log/g8e:ro
      - fedramp-fips-cloudsvc-data:/var/cloudsvc:ro
    networks:
      net_mgmt:
        ipv4_address: 10.74.0.50

volumes:
  fedramp-fips-gateway-state:
  fedramp-fips-operator-state:
  fedramp-fips-cloudsvc-data:

networks:
  net_untrusted:
    driver: bridge
    ipam:
      config:
        - subnet: 10.70.0.0/24
  net_perimeter:
    driver: bridge
    ipam:
      config:
        - subnet: 10.71.0.0/24
  net_internal:
    driver: bridge
    ipam:
      config:
        - subnet: 10.72.0.0/24
  net_secure:
    driver: bridge
    ipam:
      config:
        - subnet: 10.73.0.0/24
  net_mgmt:
    driver: bridge
    ipam:
      config:
        - subnet: 10.74.0.0/24
