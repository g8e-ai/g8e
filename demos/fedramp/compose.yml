name: g8e-fedramp

services:
  gateway:
    build:
      context: ..
      dockerfile: demos/Dockerfile
    container_name: g8e-fedramp-gateway
    hostname: gateway
    volumes:
      - fedramp-gateway-pki:/root/.g8e/pki
      - fedramp-gateway-data:/root/.g8e/data
      - ./config/gateway.yml:/etc/g8e/gateway.yml:ro
      - ./config/tribunal-bootstrap.json:/etc/g8e/tribunal-bootstrap.json:ro
      - ./config/ensemble-seed.hex:/etc/g8e/ensemble-seed.hex:ro
      - ./doctrine:/etc/g8e/doctrine:ro
    ports:
      - "8088:8080"
      - "8451:8443"
    networks:
      net_perimeter:
        ipv4_address: 10.71.0.10
      net_internal:
        ipv4_address: 10.72.0.10
      net_secure:
        ipv4_address: 10.73.0.10
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    environment:
      - G8E_GATEWAY_POSTURE=notary

  operator:
    build:
      context: ..
      dockerfile: demos/Dockerfile
    container_name: g8e-fedramp-operator
    hostname: operator
    volumes:
      - fedramp-operator-pki:/root/.g8e/pki
      - fedramp-operator-data:/root/.g8e/data
      - fedramp-operator-secrets:/root/.g8e/secrets
      - ./config/operator.yml:/etc/g8e/operator.yml:ro
      - ./cloudop.sh:/usr/local/bin/cloudop:ro
      - ./cloudsvc.py:/app/cloudsvc.py:ro
      - ./verify_ops.py:/app/verify_ops.py:ro
    networks:
      net_internal:
        ipv4_address: 10.72.0.20
      net_secure:
        ipv4_address: 10.73.0.20
    depends_on:
      gateway:
        condition: service_healthy

  agent-runtime:
    build:
      context: ..
      dockerfile: demos/Dockerfile
    container_name: g8e-fedramp-agent
    hostname: agent-runtime
    entrypoint: ["sh", "-c", "sleep infinity"]
    volumes:
      - fedramp-agent-pki:/root/.g8e/pki
      - ./config/tribunal-bootstrap.json:/etc/g8e/tribunal-bootstrap.json:ro
      - ./config/ensemble-seed.hex:/etc/g8e/ensemble-seed.hex:ro
    networks:
      net_internal:
        ipv4_address: 10.72.0.30
    depends_on:
      gateway:
        condition: service_healthy
      operator:
        condition: service_started

  cloudsvc:
    image: python@sha256:b27df5841f3355e9473f9a516d38a6783b6c8dfeacaf2d14a240f443b368ddb6
    container_name: g8e-fedramp-cloudsvc
    hostname: cloudsvc
    working_dir: /app
    command: ["python", "/app/cloudsvc.py"]
    volumes:
      - fedramp-cloudsvc-data:/var/cloudsvc
      - ./cloudsvc.py:/app/cloudsvc.py:ro
    ports:
      - "9100:9100"
    networks:
      net_secure:
        ipv4_address: 10.73.0.50

  bad-actor:
    image: alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    container_name: g8e-fedramp-bad-actor
    hostname: bad-actor
    entrypoint: ["sh", "-c", "sleep infinity"]
    networks:
      net_untrusted:
        ipv4_address: 10.70.0.50

  observability:
    image: alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    container_name: g8e-fedramp-observability
    hostname: observability
    entrypoint: ["sh", "-c", "sleep infinity"]
    volumes:
      - fedramp-gateway-data:/var/log/g8e:ro
      - fedramp-cloudsvc-data:/var/cloudsvc:ro
    networks:
      net_mgmt:
        ipv4_address: 10.74.0.50

volumes:
  fedramp-gateway-pki:
  fedramp-gateway-data:
  fedramp-operator-pki:
  fedramp-operator-data:
  fedramp-operator-secrets:
  fedramp-agent-pki:
  fedramp-cloudsvc-data:

networks:
  net_untrusted:
    driver: bridge
    ipam:
      config:
        - subnet: 10.70.0.0/24
  net_perimeter:
    driver: bridge
    ipam:
      config:
        - subnet: 10.71.0.0/24
  net_internal:
    driver: bridge
    ipam:
      config:
        - subnet: 10.72.0.0/24
  net_secure:
    driver: bridge
    ipam:
      config:
        - subnet: 10.73.0.0/24
  net_mgmt:
    driver: bridge
    ipam:
      config:
        - subnet: 10.74.0.0/24
