name: dow-demo

networks:
  net_untrusted:
    driver: bridge
    ipam:
      config:
        - subnet: 10.40.0.0/24
  net_perimeter:
    driver: bridge
    ipam:
      config:
        - subnet: 10.41.0.0/24
  net_internal:
    driver: bridge
    ipam:
      config:
        - subnet: 10.42.0.0/24
  net_secure:
    driver: bridge
    ipam:
      config:
        - subnet: 10.43.0.0/24
  net_mgmt:
    driver: bridge
    ipam:
      config:
        - subnet: 10.44.0.0/24

volumes:
  gateway_state:
  operator_state:
  target_state:
  gimbal_data:

services:
  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: dow-gateway
    networks:
      net_perimeter:
        ipv4_address: 10.41.0.10
      net_internal:
        ipv4_address: 10.42.0.10
      net_secure:
        ipv4_address: 10.43.0.10
    volumes:
      - gateway_state:/root/.g8e
      - ./doctrine:/etc/g8e/doctrine:ro
      - ./slew.sh:/usr/local/bin/slew:ro
    ports:
      - "8086:8080"
      - "8449:8443"
    working_dir: /root
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: ["gw", "start", "-f", "--posture", "consensus", "--passkey-rp-origin", "http://localhost:8086", "--passkey-rp-origin", "https://localhost:8449"]

  operator:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: dow-operator
    networks:
      net_internal:
        ipv4_address: 10.42.0.20
      net_secure:
        ipv4_address: 10.43.0.20
    extra_hosts:
      - "g8e.local:10.42.0.10"
    volumes:
      - operator_state:/root/.g8e
      - ./dow_simulator.py:/app/dow_simulator.py:ro
      - ./target-data:/var/g8e/target:ro
      - ./slew.sh:/usr/local/bin/slew:ro
    depends_on:
      gateway:
        condition: service_healthy
    working_dir: /root
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    environment:
      - SENSOR_ID=OPERATOR-01
      - PLATFORM_ID=EDGE-01
    healthcheck:
      test: ["CMD", "test", "-f", "/root/.g8e/pki/operator.crt"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: ["operator", "start", "-e", "10.42.0.10", "--execution-vault"]

  agent-sigint:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: dow-agent-sigint
    networks:
      net_internal:
        ipv4_address: 10.42.0.31
    extra_hosts:
      - "g8e.local:10.42.0.10"
    volumes:
      - operator_state:/root/.g8e:ro
      - ./target-data:/var/g8e/target:ro
    depends_on:
      gateway:
        condition: service_healthy
      operator:
        condition: service_healthy
    working_dir: /root
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    environment:
      - SENSOR_ID=SIGINT-01
      - SENSOR_TYPE=sigint
    command: ["demos", "scenarios", "run",
              "--mtls-url", "https://g8e.local:8443",
              "--public-url", "http://g8e.local:8080",
              "--cert", "/root/.g8e/pki/operator.crt",
              "--key", "/root/.g8e/pki/operator.key",
              "--ca", "/root/.g8e/pki/trust/g8eg-ca-bundle.pem",
              "--ensemble", "3",
              "--l3-mode", "mock",
              "dow-cross-cue"]

  agent-eoir:
    image: python@sha256:b27df5841f3355e9473f9a516d38a6783b6c8dfeacaf2d14a240f443b368ddb6
    container_name: dow-agent-eoir
    networks:
      net_internal:
        ipv4_address: 10.42.0.32
    volumes:
      - ./dow_simulator.py:/app/dow_simulator.py:ro
      - ./target-data:/var/g8e/target:ro
      - ./inspect_rf.py:/app/inspect_rf.py:ro
      - ./inspect_pnt.py:/app/inspect_pnt.py:ro
    depends_on:
      gateway:
        condition: service_healthy
    working_dir: /app
    restart: unless-stopped
    environment:
      - SENSOR_ID=EOIR-01
      - SENSOR_TYPE=eoir
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    command: ["python", "dow_simulator.py", "EOIR-01", "eoir"]

  agent-pnt-fusion:
    image: python@sha256:b27df5841f3355e9473f9a516d38a6783b6c8dfeacaf2d14a240f443b368ddb6
    container_name: dow-agent-pnt-fusion
    networks:
      net_internal:
        ipv4_address: 10.42.0.33
    volumes:
      - ./dow_simulator.py:/app/dow_simulator.py:ro
      - ./target-data:/var/g8e/target:ro
      - ./inspect_pnt.py:/app/inspect_pnt.py:ro
    depends_on:
      gateway:
        condition: service_healthy
    working_dir: /app
    restart: unless-stopped
    environment:
      - SENSOR_ID=PNT-FUSION-01
      - SENSOR_TYPE=pnt_fusion
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    command: ["python", "dow_simulator.py", "PNT-FUSION-01", "pnt_fusion"]

  gimbal:
    image: python@sha256:b27df5841f3355e9473f9a516d38a6783b6c8dfeacaf2d14a240f443b368ddb6
    container_name: dow-gimbal
    networks:
      net_secure:
        ipv4_address: 10.43.0.40
    volumes:
      - gimbal_data:/var/gimbal
      - ./gimbal.py:/app/gimbal.py:ro
      - ./verify_slews.py:/app/verify_slews.py:ro
    working_dir: /app
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 32M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    command: ["python", "gimbal.py"]

  ground-station:
    image: alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    container_name: dow-ground-station
    networks:
      net_perimeter:
        ipv4_address: 10.41.0.30
    depends_on:
      gateway:
        condition: service_healthy
    command: ["sh", "-c", "while true; do echo '[GROUND-STATION] Tactical datalink active. Monitoring EDGE-01...'; sleep 30; done"]

  ew-adversary:
    image: alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    container_name: dow-ew-adversary
    networks:
      net_untrusted:
    command: ["sh", "-c", "while true; do echo '[EW-ADVERSARY] Emitting spoofed GNSS signals on L1/L2...'; echo '[EW-ADVERSARY] Attempting tactical datalink jam on UHF...'; sleep 30; done"]

  observability:
    image: alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    container_name: dow-observability
    networks:
      net_mgmt:
    volumes:
      - gateway_state:/data/gateway:ro
      - operator_state:/data/operator:ro
    command: ["sh", "-c", "until [ -f /data/gateway/logs/operator.log ]; do sleep 2; done; tail -f /data/gateway/logs/operator.log"]
