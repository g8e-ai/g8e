name: dow-demo

networks:
  net_untrusted:
    driver: bridge
    ipam:
      config:
        - subnet: 10.40.0.0/24
  net_perimeter:
    driver: bridge
    ipam:
      config:
        - subnet: 10.41.0.0/24
  net_internal:
    driver: bridge
    ipam:
      config:
        - subnet: 10.42.0.0/24
  net_secure:
    driver: bridge
    ipam:
      config:
        - subnet: 10.43.0.0/24
  net_mgmt:
    driver: bridge
    ipam:
      config:
        - subnet: 10.44.0.0/24

volumes:
  gateway_state:
  operator_state:
  target_state:

services:
  gateway:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: dow-gateway
    networks:
      net_perimeter:
        ipv4_address: 10.41.0.10
      net_internal:
        ipv4_address: 10.42.0.10
    volumes:
      - gateway_state:/root/.g8e
      - ./doctrine:/etc/g8e/doctrine:ro
    ports:
      - "8086:8080"
      - "8449:8443"
    working_dir: /root
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: ["gw", "start", "-f"]

  operator:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: dow-operator
    networks:
      net_internal:
        ipv4_address: 10.42.0.20
      net_secure:
        ipv4_address: 10.43.0.20
    extra_hosts:
      - "g8e.local:10.42.0.10"
    volumes:
      - operator_state:/root/.g8e
      - ./dow_simulator.py:/app/dow_simulator.py:ro
      - ./target-data:/var/g8e/target:ro
    depends_on:
      gateway:
        condition: service_healthy
    working_dir: /root
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    environment:
      - SENSOR_ID=OPERATOR-01
      - PLATFORM_ID=EDGE-01
    healthcheck:
      test: ["CMD", "test", "-f", "/root/.g8e/pki/operator.crt"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: ["operator", "run", "-e", "10.42.0.10"]

  agent-sigint:
    image: python:3.11-slim
    container_name: dow-agent-sigint
    networks:
      net_internal:
        ipv4_address: 10.42.0.31
    volumes:
      - ./dow_simulator.py:/app/dow_simulator.py:ro
      - ./target-data:/var/g8e/target:ro
    depends_on:
      gateway:
        condition: service_healthy
    working_dir: /app
    restart: unless-stopped
    environment:
      - SENSOR_ID=SIGINT-01
      - SENSOR_TYPE=sigint
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    command: ["python", "dow_simulator.py", "SIGINT-01", "sigint"]

  agent-eoir:
    image: python:3.11-slim
    container_name: dow-agent-eoir
    networks:
      net_internal:
        ipv4_address: 10.42.0.32
    volumes:
      - ./dow_simulator.py:/app/dow_simulator.py:ro
      - ./target-data:/var/g8e/target:ro
    depends_on:
      gateway:
        condition: service_healthy
    working_dir: /app
    restart: unless-stopped
    environment:
      - SENSOR_ID=EOIR-01
      - SENSOR_TYPE=eoir
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    command: ["python", "dow_simulator.py", "EOIR-01", "eoir"]

  agent-pnt-fusion:
    image: python:3.11-slim
    container_name: dow-agent-pnt-fusion
    networks:
      net_internal:
        ipv4_address: 10.42.0.33
    volumes:
      - ./dow_simulator.py:/app/dow_simulator.py:ro
      - ./target-data:/var/g8e/target:ro
    depends_on:
      gateway:
        condition: service_healthy
    working_dir: /app
    restart: unless-stopped
    environment:
      - SENSOR_ID=PNT-FUSION-01
      - SENSOR_TYPE=pnt_fusion
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    command: ["python", "dow_simulator.py", "PNT-FUSION-01", "pnt_fusion"]

  ground-station:
    image: alpine:latest
    container_name: dow-ground-station
    networks:
      net_perimeter:
        ipv4_address: 10.41.0.30
    depends_on:
      gateway:
        condition: service_healthy
    command: ["sh", "-c", "while true; do echo '[GROUND-STATION] Tactical datalink active. Monitoring EDGE-01...'; sleep 30; done"]

  ew-adversary:
    image: alpine:latest
    container_name: dow-ew-adversary
    networks:
      net_untrusted:
    command: ["sh", "-c", "while true; do echo '[EW-ADVERSARY] Emitting spoofed GNSS signals on L1/L2...'; echo '[EW-ADVERSARY] Attempting tactical datalink jam on UHF...'; sleep 30; done"]

  observability:
    image: alpine:latest
    container_name: dow-observability
    networks:
      net_mgmt:
    volumes:
      - gateway_state:/data/gateway:ro
      - operator_state:/data/operator:ro
    command: ["sh", "-c", "until [ -f /data/gateway/logs/operator.log ]; do sleep 2; done; tail -f /data/gateway/logs/operator.log"]
