name: secure-data-demo

# Two-Operator topology: source domain and destination domain each have their own
# Gateway (PDPoint) and Operator (L5 Actuator). Chain of custody requires both
# to sign a receipt — neither implicitly trusts the other.

networks:
  net_src_internal:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.0.0/24
  net_dst_internal:
    driver: bridge
    ipam:
      config:
        - subnet: 10.21.0.0/24
  net_migration:
    driver: bridge
    ipam:
      config:
        - subnet: 10.22.0.0/24
  net_untrusted:
    driver: bridge
    ipam:
      config:
        - subnet: 10.23.0.0/24
  net_mgmt:
    driver: bridge
    ipam:
      config:
        - subnet: 10.24.0.0/24

volumes:
  src_gateway_state:
  src_operator_state:
  dst_gateway_state:
  dst_operator_state:
  source_data:
  dest_data:

services:

  # ── Source domain ──────────────────────────────────────────────────────────

  src-gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: secure-data-src-gateway
    networks:
      net_src_internal:
        ipv4_address: 10.20.0.10
      net_mgmt:
        ipv4_address: 10.24.0.10
    volumes:
      - src_gateway_state:/root/.g8e
      - ./doctrine:/etc/g8e/doctrine:ro
    ports:
      - "8083:8080"
      - "8446:8443"
    working_dir: /root
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: ["gw", "start", "-f", "--passkey-rp-origin", "http://localhost:8083", "--passkey-rp-origin", "https://localhost:8446"]

  src-operator:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: secure-data-src-operator
    networks:
      net_src_internal:
        ipv4_address: 10.20.0.20
      net_migration:
        ipv4_address: 10.22.0.10
    extra_hosts:
      - "g8e.local:10.20.0.10"
    volumes:
      - src_operator_state:/root/.g8e
    depends_on:
      src-gateway:
        condition: service_healthy
    working_dir: /root
    healthcheck:
      test: ["CMD", "test", "-f", "/root/.g8e/pki/operator.crt"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: ["operator", "run", "-e", "10.20.0.10"]

  # ── Destination domain ─────────────────────────────────────────────────────

  dst-gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: secure-data-dst-gateway
    networks:
      net_dst_internal:
        ipv4_address: 10.21.0.10
      net_mgmt:
        ipv4_address: 10.24.0.20
    volumes:
      - dst_gateway_state:/root/.g8e
      - ./doctrine:/etc/g8e/doctrine:ro
    ports:
      - "8084:8080"
      - "8447:8443"
    working_dir: /root
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: ["gw", "start", "-f", "--passkey-rp-origin", "http://localhost:8084", "--passkey-rp-origin", "https://localhost:8447"]

  dst-operator:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: secure-data-dst-operator
    networks:
      net_dst_internal:
        ipv4_address: 10.21.0.20
      net_migration:
        ipv4_address: 10.22.0.20
    extra_hosts:
      - "g8e.local:10.21.0.10"
    volumes:
      - dst_operator_state:/root/.g8e
    depends_on:
      dst-gateway:
        condition: service_healthy
    working_dir: /root
    healthcheck:
      test: ["CMD", "test", "-f", "/root/.g8e/pki/operator.crt"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: ["operator", "run", "-e", "10.21.0.10"]

  # ── Connectors: enrolled apps that produce GovernanceEnvelopes ─────────────
  # Each connector holds an mTLS identity issued by src-gateway.
  # It submits envelopes; src-operator executes the actual transfer tool.

  agent-runtime:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: secure-data-agent-runtime
    networks:
      net_src_internal:
        ipv4_address: 10.20.0.30
    extra_hosts:
      - "g8e.local:10.20.0.10"
    volumes:
      - src_operator_state:/root/.g8e:ro
    depends_on:
      src-operator:
        condition: service_healthy
    working_dir: /root
    entrypoint: ["sh", "-c", "sleep infinity"]

  # ── Storage endpoints ──────────────────────────────────────────────────────
  # source-storage: simulates source (SharePoint On-Prem / file server / S3).
  #   Reachable only on net_src_internal; src-operator reads from here.
  # dest-storage: simulates destination (SharePoint Online / S3 / Azure Blob).
  #   Reachable on net_migration (src-operator writes via rclone) and
  #   net_dst_internal (dst-operator verifies arrival).

  source-storage:
    image: alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    container_name: secure-data-source-storage
    networks:
      net_src_internal:
        ipv4_address: 10.20.0.50
    volumes:
      - source_data:/var/data
      - ./target-data:/var/g8e/target:ro
    command: ["sh", "-c", "cp -r /var/g8e/target/* /var/data/ 2>/dev/null; while true; do sleep 3600; done"]

  dest-storage:
    image: alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    container_name: secure-data-dest-storage
    networks:
      net_migration:
        ipv4_address: 10.22.0.50
      net_dst_internal:
        ipv4_address: 10.21.0.50
    volumes:
      - dest_data:/var/intake
    command: ["sh", "-c", "while true; do sleep 3600; done"]

  # ── Bad actor: isolated on untrusted network ───────────────────────────────
  # No path to source or destination storage, no path to either gateway.

  bad-actor:
    image: alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    container_name: secure-data-bad-actor
    networks:
      net_untrusted:
    command: ["sh", "-c", "while true; do sleep 3600; done"]

  # ── Observability: reads audit logs from both gateways ────────────────────

  observability:
    image: alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    container_name: secure-data-observability
    networks:
      net_mgmt:
    volumes:
      - src_gateway_state:/data/src-gateway:ro
      - dst_gateway_state:/data/dst-gateway:ro
    command: ["sh", "-c", "until [ -f /data/src-gateway/logs/operator.log ]; do sleep 2; done; tail -f /data/src-gateway/logs/operator.log /data/dst-gateway/logs/operator.log 2>/dev/null"]
