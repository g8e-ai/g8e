name: secure-data-demo

networks:
  net_untrusted:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.0.0/24
  net_perimeter:
    driver: bridge
    ipam:
      config:
        - subnet: 10.21.0.0/24
  net_internal:
    driver: bridge
    ipam:
      config:
        - subnet: 10.22.0.0/24
  net_secure:
    driver: bridge
    ipam:
      config:
        - subnet: 10.23.0.0/24
  net_mgmt:
    driver: bridge
    ipam:
      config:
        - subnet: 10.24.0.0/24

volumes:
  gateway_state:
  operator_state:
  source_state:
  review_state:

services:
  gateway:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: secure-data-gateway
    networks:
      net_perimeter:
        ipv4_address: 10.21.0.10
      net_internal:
        ipv4_address: 10.22.0.10
    volumes:
      - gateway_state:/root/.g8e
      - ./doctrine:/etc/g8e/doctrine:ro
    ports:
      - "8083:8080"
      - "8446:8443"
    working_dir: /root
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: ["gw", "start", "-f"]

  operator:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: secure-data-operator
    networks:
      net_internal:
        ipv4_address: 10.22.0.20
      net_secure:
        ipv4_address: 10.23.0.20
    extra_hosts:
      - "g8e.local:10.22.0.10"
    volumes:
      - operator_state:/root/.g8e
    depends_on:
      gateway:
        condition: service_healthy
    working_dir: /root
    healthcheck:
      test: ["CMD", "test", "-f", "/root/.g8e/pki/operator.crt"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: ["-e", "10.22.0.10"]

  # Source host: holds the sensitive transfer set on the secure tier.
  source-host:
    image: alpine:latest
    container_name: secure-data-source
    networks:
      net_secure:
        ipv4_address: 10.23.0.30
    volumes:
      - source_state:/var/target
      - ./target-data:/var/g8e/target:ro
    depends_on:
      operator:
        condition: service_healthy
    command: ["sh", "-c", "while true; do sleep 3600; done"]

  # Review host: the governed destination an evidence set is transferred to.
  # Reachable only on net_secure, only via an Operator-executed, audited transfer.
  review-host:
    image: alpine:latest
    container_name: secure-data-review
    networks:
      net_secure:
        ipv4_address: 10.23.0.40
    volumes:
      - review_state:/intake
    depends_on:
      operator:
        condition: service_healthy
    command: ["sh", "-c", "while true; do sleep 3600; done"]

  agent-runtime:
    image: alpine:latest
    container_name: secure-data-agent
    networks:
      net_internal:
    depends_on:
      gateway:
        condition: service_healthy
    command: ["sh", "-c", "while true; do sleep 3600; done"]

  llm-backend:
    image: alpine:latest
    container_name: secure-data-llm
    networks:
      net_internal:
    depends_on:
      gateway:
        condition: service_healthy
    command: ["sh", "-c", "while true; do sleep 3600; done"]

  demo-ui:
    image: nginx:alpine
    container_name: secure-data-demo-ui
    networks:
      net_perimeter:
        ipv4_address: 10.21.0.20
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "3003:80"
    command: ["nginx", "-g", "daemon off;"]

  bad-actor:
    image: alpine:latest
    container_name: secure-data-bad-actor
    networks:
      net_untrusted:
    command: ["sh", "-c", "while true; do sleep 3600; done"]

  observability:
    image: alpine:latest
    container_name: secure-data-observability
    networks:
      net_mgmt:
    volumes:
      - gateway_state:/data/gateway:ro
      - operator_state:/data/operator:ro
    command: ["sh", "-c", "until [ -f /data/gateway/logs/operator.log ]; do sleep 2; done; tail -f /data/gateway/logs/operator.log"]
