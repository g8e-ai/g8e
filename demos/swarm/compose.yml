name: swarm-demo

networks:
  net_untrusted:
    driver: bridge
    ipam:
      config:
        - subnet: 10.30.0.0/24
  net_perimeter:
    driver: bridge
    ipam:
      config:
        - subnet: 10.31.0.0/24
  net_internal:
    driver: bridge
    ipam:
      config:
        - subnet: 10.32.0.0/24
  net_secure:
    driver: bridge
    ipam:
      config:
        - subnet: 10.33.0.0/24
  net_mgmt:
    driver: bridge
    ipam:
      config:
        - subnet: 10.34.0.0/24

volumes:
  gateway_state:
  operator_1_state:
  operator_2_state:
  operator_3_state:
  operator_4_state:
  operator_5_state:
  operator_6_state:
  operator_7_state:
  operator_8_state:
  operator_9_state:
  operator_10_state:
  operator_11_state:
  operator_12_state:
  operator_13_state:
  operator_14_state:
  operator_15_state:
  operator_16_state:
  operator_17_state:
  operator_18_state:
  operator_19_state:
  operator_20_state:

services:
  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: swarm-gateway
    networks:
      net_perimeter:
        ipv4_address: 10.31.0.10
      net_internal:
        ipv4_address: 10.32.0.10
    volumes:
      - gateway_state:/root/.g8e
      - ./doctrine:/etc/g8e/doctrine:ro
    ports:
      - "8085:8080"
      - "8448:8443"
    working_dir: /root
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: ["gw", "start", "-f", "--passkey-rp-origin", "http://localhost:8085", "--passkey-rp-origin", "https://localhost:8448"]

  # Drone Operator 1 - Recon
  operator-1:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: swarm-operator-1
    networks:
      net_internal:
        ipv4_address: 10.32.0.21
      net_secure:
        ipv4_address: 10.33.0.21
    extra_hosts:
      - "g8e.local:10.32.0.10"
    volumes:
      - operator_1_state:/root/.g8e
      - ./drone_simulator.py:/app/drone_simulator.py:ro
      - ./target-data:/var/g8e/target:ro
    depends_on:
      gateway:
        condition: service_healthy
    working_dir: /root
    environment:
      - DRONE_ID=DRONE-001
      - DRONE_TYPE=recon
    healthcheck:
      test: ["CMD", "test", "-f", "/root/.g8e/pki/operator.crt"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: ["operator", "run", "-e", "10.32.0.10"]

