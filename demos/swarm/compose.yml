  # Command and Control Interface
  command-interface:
    image: python@sha256:b27df5841f3355e9473f9a516d38a6783b6c8dfeacaf2d14a240f443b368ddb6
    container_name: swarm-command-interface
    networks:
      net_internal:
        ipv4_address: 10.32.0.50
    volumes:
      - ./target-data:/var/g8e/target:ro
    depends_on:
      gateway:
        condition: service_healthy
    command: ["sh", "-c", "python3 -c 'import http.server\nclass H(http.server.BaseHTTPRequestHandler):\n def do_GET(self):\n  self.send_response(200)\n  self.send_header(\"Content-Type\",\"text/plain\")\n  self.end_headers()\n  self.wfile.write(b\"Drone Swarm Command Interface - Fleet Status: ACTIVE\")\nhttp.server.HTTPServer((\"0.0.0.0\",5000),H).serve_forever()'"]
    ports:
      - "5005:5000"

  # Agent runtime for g8e demos scenarios execution
  agent-runtime:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: swarm-agent
    networks:
      net_internal:
    extra_hosts:
      - "g8e.local:10.32.0.10"
    volumes:
      - operator_1_state:/root/.g8e:ro
    depends_on:
      gateway:
        condition: service_healthy
      operator-1:
        condition: service_healthy
    working_dir: /root
    entrypoint: ["sh", "-c", "sleep infinity"]

  # Simulated adversary attempting to compromise drone swarm
  adversary:
    image: alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    container_name: swarm-adversary
    networks:
      net_untrusted:
    command: ["sh", "-c", "while true; do echo 'Attempting to intercept drone communications...'; sleep 30; done"]

  # Observability and monitoring
  observability:
    image: alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    container_name: swarm-observability
    networks:
      net_mgmt:
    volumes:
      - gateway_state:/data/gateway:ro
      - operator_1_state:/data/operator-1:ro
      - operator_2_state:/data/operator-2:ro
