name: healthcare-demo

networks:
  net_untrusted:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.0.0/24
  net_perimeter:
    driver: bridge
    ipam:
      config:
        - subnet: 10.21.0.0/24
  net_internal:
    driver: bridge
    ipam:
      config:
        - subnet: 10.22.0.0/24
  net_secure:
    driver: bridge
    ipam:
      config:
        - subnet: 10.23.0.0/24
  net_mgmt:
    driver: bridge
    ipam:
      config:
        - subnet: 10.24.0.0/24

volumes:
  gateway_state:
  operator_state:
  pa_db_data:
  metabase_data:

services:
  gateway:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: healthcare-gateway
    networks:
      net_perimeter:
        ipv4_address: 10.21.0.10
      net_internal:
        ipv4_address: 10.22.0.10
    volumes:
      - gateway_state:/root/.g8e
      - ./doctrine:/etc/g8e/doctrine:ro
      - ./paop.sh:/usr/local/bin/paop:ro
      - /etc/hosts:/etc/hosts.host:ro
      - /etc/hostname:/etc/hostname.host:ro
    ports:
      - "8081:8080"
      - "8444:8443"
    working_dir: /root
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: ["gw", "start", "-f", "--doctrine-dir", "/etc/g8e/doctrine", "--passkey-rp-origin", "http://localhost:8081", "--passkey-rp-origin", "https://localhost:8444"]

  operator:
    # Full-stack default: the operator starts with the gateway. The gateway
    # starts with zero users, so the operator submits a platform enrollment
    # request and waits for owner approval before it becomes ready. The
    # operator healthcheck (operator.crt existence) stays not-ready until
    # the enrollment completes, so dependent services (agent-runtime) wait
    # via depends_on: condition: service_healthy. The bootstrap flow is:
    #   docker compose up -d
    #   ./g8e auth enroll user -e <gateway>
    #   ./g8e auth pending-platform-enrollments
    #   ./g8e auth approve-platform-enrollment <request-id> --yes
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: healthcare-operator
    networks:
      net_internal:
        ipv4_address: 10.22.0.20
      net_secure:
        ipv4_address: 10.23.0.20
    extra_hosts:
      - "g8e.local:10.22.0.10"
    volumes:
      - operator_state:/root/.g8e
      - ./paop.sh:/usr/local/bin/paop:ro
    depends_on:
      gateway:
        condition: service_healthy
    working_dir: /root
    healthcheck:
      test: ["CMD", "test", "-f", "/root/.g8e/pki/operator.crt"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: ["operator", "start", "-e", "g8e.local"]

  # Stores compliance metrics for mandatory DCBS/OHA annual reporting (March 1 & 31 deadlines).
  reporting-db:
    image: postgres@sha256:3b0d656f5fff31c7d8a64f500a703dcf3f35e98ce78f602831a73059a5e6a012
    container_name: healthcare-reporting-db
    networks:
      net_secure:
        ipv4_address: 10.23.0.70
    environment:
      - POSTGRES_USER=compliance_admin
      - POSTGRES_PASSWORD=secure_hipaa_password
      - POSTGRES_DB=oregon_pa_metrics
    volumes:
      - pa_db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compliance_admin -d oregon_pa_metrics"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # DCBS/OHA Reporting: Metabase dashboards for % denials (standard vs expedited) and median
  # decision time. Navigate to localhost:3001 to build required state compliance reports.
  compliance-dashboard:
    image: metabase/metabase@sha256:c37d32ea9cef073fd0f73514462fd3e3a847aaed78fbe99b3c3362879c9e62b6
    container_name: healthcare-compliance-ui
    networks:
      net_perimeter:
        ipv4_address: 10.21.0.20
      net_secure:
        ipv4_address: 10.23.0.80
    environment:
      - MB_SITE_URL=http://localhost:3001
      - MB_ENCRYPTION_SECRET_KEY=super-secret-key-for-demo-only-change-in-production
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      reporting-db:
        condition: service_healthy
    ports:
      - "3001:3000"

  # One-shot service: configures Metabase admin account, database connection, and pre-loads
  # the two mandatory DCBS/OHA compliance queries. Exits after setup; never restarts.
  metabase-setup:
    image: python@sha256:b27df5841f3355e9473f9a516d38a6783b6c8dfeacaf2d14a240f443b368ddb6
    container_name: healthcare-metabase-setup
    restart: "no"
    networks:
      net_perimeter:
    environment:
      - METABASE_URL=http://compliance-dashboard:3000
      - MB_ADMIN_EMAIL=admin@g8e.local
      - MB_ADMIN_PASSWORD=Metabase1!
      - DB_HOST=reporting-db
      - DB_USER=compliance_admin
      - DB_PASS=secure_hipaa_password
    volumes:
      - ./setup_metabase.py:/app/setup_metabase.py:ro
    depends_on:
      compliance-dashboard:
        condition: service_started
      reporting-db:
        condition: service_healthy
    command: ["sh", "-c", "python /app/setup_metabase.py"]

  # Authorized AI agent simulating a payer system submitting PA requests through the g8e gateway.
  agent-runtime:
    # Depends on the operator (which waits for owner approval).
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: healthcare-agent
    networks:
      net_internal:
    extra_hosts:
      - "g8e.local:10.22.0.10"
    volumes:
      - operator_state:/root/.g8e:ro
    depends_on:
      gateway:
        condition: service_healthy
      operator:
        condition: service_healthy
    working_dir: /root
    entrypoint: ["sh", "-c", "sleep infinity"]

  # Simulates an unauthorized party attempting to exfiltrate PHI or bypass the PA workflow.
  bad-actor:
    image: alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    container_name: healthcare-bad-actor
    networks:
      net_untrusted:
    command: ["sh", "-c", "while true; do sleep 3600; done"]

  observability:
    image: alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    container_name: healthcare-observability
    networks:
      net_mgmt:
    volumes:
      - gateway_state:/data/gateway:ro
      - operator_state:/data/operator:ro
    command: ["sh", "-c", "until [ -f /data/gateway/logs/g8e.log ]; do sleep 2; done; tail -f /data/gateway/logs/g8e.log"]
