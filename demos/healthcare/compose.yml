name: healthcare-demo

networks:
  net_untrusted:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.0.0/24
  net_perimeter:
    driver: bridge
    ipam:
      config:
        - subnet: 10.21.0.0/24
  net_internal:
    driver: bridge
    ipam:
      config:
        - subnet: 10.22.0.0/24
  net_secure:
    driver: bridge
    ipam:
      config:
        - subnet: 10.23.0.0/24
  net_mgmt:
    driver: bridge
    ipam:
      config:
        - subnet: 10.24.0.0/24

volumes:
  gateway_state:
  operator_state:
  pa_db_data:
  rabbitmq_data:
  metabase_data:

services:
  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: healthcare-gateway
    networks:
      net_perimeter:
        ipv4_address: 10.21.0.10
      net_internal:
        ipv4_address: 10.22.0.10
    volumes:
      - gateway_state:/root/.g8e
      - ./doctrine:/etc/g8e/doctrine:ro
    ports:
      - "8081:8080"
      - "8444:8443"
    working_dir: /root
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: ["gw", "start", "-f", "--mcp-downstream-url", "http://healthcare-pa-api:8000", "--passkey-rp-origin", "http://localhost:8081", "--passkey-rp-origin", "https://localhost:8444"]

  operator:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: healthcare-operator
    networks:
      net_internal:
        ipv4_address: 10.22.0.20
      net_secure:
        ipv4_address: 10.23.0.20
    extra_hosts:
      - "g8e.local:10.22.0.10"
    volumes:
      - operator_state:/root/.g8e
    depends_on:
      gateway:
        condition: service_healthy
    working_dir: /root
    healthcheck:
      test: ["CMD", "test", "-f", "/root/.g8e/pki/operator.crt"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: ["operator", "start", "-e", "g8e.local"]

  # HB 3134 (2027 API Mandate): FHIR R4-compliant PA submission endpoint replacing fax-based workflows.
  # Bridges net_internal so the g8e gateway can enforce PHI doctrine on inbound requests.
  pa-submission-service:
    image: python@sha256:b27df5841f3355e9473f9a516d38a6783b6c8dfeacaf2d14a240f443b368ddb6
    container_name: healthcare-pa-api
    networks:
      net_internal:
        ipv4_address: 10.22.0.30
      net_secure:
        ipv4_address: 10.23.0.30
    environment:
      - QUEUE_HOST=message-broker
      - DB_HOST=reporting-db
      - FHIR_VERSION=R4
    volumes:
      - ./target-data:/var/g8e/target:ro
      - ./pa_api_server.py:/app/pa_api_server.py:ro
    depends_on:
      operator:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    command: ["python", "/app/pa_api_server.py"]

  # HB 3134 (Provider Exemptions / Gold Carding): auto-approves requests from providers whose
  # historic approval rate meets or exceeds EXEMPTION_THRESHOLD_PERCENTAGE.
  provider-exemption-rules:
    image: node@sha256:fb4cd12c85ee03686f6af5362a0b0d56d50c58a04632e6c0fb8363f609372293
    container_name: healthcare-exemption-rules
    networks:
      net_secure:
        ipv4_address: 10.23.0.40
    environment:
      - DB_HOST=reporting-db
      - EXEMPTION_THRESHOLD_PERCENTAGE=90
    depends_on:
      reporting-db:
        condition: service_healthy
    command: ["sh", "-c", "while true; do sleep 3600; done"]

  # 2026 CCO Medicaid Rule: tracks days-elapsed per request; alerts reviewers at day 5 to
  # prevent breach of the 7-day maximum turnaround SLA.
  pa-processing-worker:
    image: python@sha256:b27df5841f3355e9473f9a516d38a6783b6c8dfeacaf2d14a240f443b368ddb6
    container_name: healthcare-pa-worker
    networks:
      net_secure:
        ipv4_address: 10.23.0.50
    environment:
      - SLA_TIMEOUT_DAYS=7
      - SLA_ALERT_THRESHOLD_DAYS=5
      - QUEUE_HOST=message-broker
      - DB_HOST=reporting-db
    depends_on:
      message-broker:
        condition: service_healthy
      reporting-db:
        condition: service_healthy
    command: ["python", "-c", "import time; [time.sleep(3600) for _ in iter(int, 1)]"]

  # Async queue for PA requests; navigate to localhost:15673 to watch request throughput.
  message-broker:
    image: rabbitmq@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69
    container_name: healthcare-message-broker
    networks:
      net_secure:
        ipv4_address: 10.23.0.60
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Stores compliance metrics for mandatory DCBS/OHA annual reporting (March 1 & 31 deadlines).
  reporting-db:
    image: postgres@sha256:3b0d656f5fff31c7d8a64f500a703dcf3f35e98ce78f602831a73059a5e6a012
    container_name: healthcare-reporting-db
    networks:
      net_secure:
        ipv4_address: 10.23.0.70
    environment:
      - POSTGRES_USER=compliance_admin
      - POSTGRES_PASSWORD=secure_hipaa_password
      - POSTGRES_DB=oregon_pa_metrics
    volumes:
      - pa_db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compliance_admin -d oregon_pa_metrics"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # DCBS/OHA Reporting: Metabase dashboards for % denials (standard vs expedited) and median
  # decision time. Navigate to localhost:3001 to build required state compliance reports.
  compliance-dashboard:
    image: metabase/metabase@sha256:c37d32ea9cef073fd0f73514462fd3e3a847aaed78fbe99b3c3362879c9e62b6
    container_name: healthcare-compliance-ui
    networks:
      net_perimeter:
        ipv4_address: 10.21.0.20
      net_secure:
        ipv4_address: 10.23.0.80
    environment:
      - MB_SITE_URL=http://localhost:3001
      - MB_ENCRYPTION_SECRET_KEY=super-secret-key-for-demo-only-change-in-production
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      reporting-db:
        condition: service_healthy
    ports:
      - "3001:3000"

  # One-shot service: configures Metabase admin account, database connection, and pre-loads
  # the two mandatory DCBS/OHA compliance queries. Exits after setup; never restarts.
  metabase-setup:
    image: python@sha256:b27df5841f3355e9473f9a516d38a6783b6c8dfeacaf2d14a240f443b368ddb6
    container_name: healthcare-metabase-setup
    restart: "no"
    networks:
      net_perimeter:
    environment:
      - METABASE_URL=http://compliance-dashboard:3000
      - MB_ADMIN_EMAIL=admin@g8e.local
      - MB_ADMIN_PASSWORD=Metabase1!
      - DB_HOST=reporting-db
      - DB_USER=compliance_admin
      - DB_PASS=secure_hipaa_password
    volumes:
      - ./setup_metabase.py:/app/setup_metabase.py:ro
    depends_on:
      compliance-dashboard:
        condition: service_started
      reporting-db:
        condition: service_healthy
    command: ["sh", "-c", "python /app/setup_metabase.py"]

  # Authorized AI agent simulating a payer system submitting PA requests via FHIR through the g8e gateway.
  agent-runtime:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: healthcare-agent
    networks:
      net_internal:
    extra_hosts:
      - "g8e.local:10.22.0.10"
    environment:
      - G8E_GATEWAY_URL=https://g8e.local:8443/mcp
    volumes:
      - operator_state:/root/.g8e:ro
    depends_on:
      gateway:
        condition: service_healthy
      operator:
        condition: service_healthy
    working_dir: /root
    entrypoint: ["sh", "-c", "sleep infinity"]

  # Simulates an unauthorized party attempting to exfiltrate PHI or bypass the PA workflow.
  bad-actor:
    image: alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    container_name: healthcare-bad-actor
    networks:
      net_untrusted:
    command: ["sh", "-c", "while true; do sleep 3600; done"]

  observability:
    image: alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    container_name: healthcare-observability
    networks:
      net_mgmt:
    volumes:
      - gateway_state:/data/gateway:ro
      - operator_state:/data/operator:ro
    command: ["sh", "-c", "until [ -f /data/gateway/logs/operator.log ]; do sleep 2; done; tail -f /data/gateway/logs/operator.log"]
