# g8e Gateway Configuration for Healthcare Demo
posture: doctrine
http_port: 8080
https_port: 8443
data_dir: /root/.g8e/data
pki_dir: /root/.g8e/pki
secrets_dir: /root/.g8e/secrets
vault_dir: /root/.g8e/vault
passkey_rpid: localhost
passkey_rpname: g8e-healthcare
rate_limit_rps: 10
rate_limit_burst: 20
cert_mode: localhost
