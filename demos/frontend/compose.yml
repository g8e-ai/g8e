name: frontend-demo

networks:
  net_untrusted:
    driver: bridge
    ipam:
      config:
        - subnet: 10.30.0.0/24
  net_perimeter:
    driver: bridge
    ipam:
      config:
        - subnet: 10.31.0.0/24
  net_internal:
    driver: bridge
    ipam:
      config:
        - subnet: 10.32.0.0/24
  net_secure:
    driver: bridge
    ipam:
      config:
        - subnet: 10.33.0.0/24
  net_mgmt:
    driver: bridge
    ipam:
      config:
        - subnet: 10.34.0.0/24

volumes:
  gateway_state:
  operator_state:

services:
  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: frontend-gateway
    networks:
      net_perimeter:
        ipv4_address: 10.31.0.10
      net_internal:
        ipv4_address: 10.32.0.10
    volumes:
      - gateway_state:/root/.g8e
      - ./doctrine:/etc/g8e/doctrine:ro
    ports:
      - "8083:8080"
      - "8446:8443"
    working_dir: /root
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: ["gw", "start", "-f",
      "--doctrine-dir", "/etc/g8e/doctrine",
      "--passkey-rp-origin", "http://localhost:8083",
      "--passkey-rp-origin", "https://localhost:8446",
      "--passkey-rp-origin", "http://localhost:3003",
      "--cors-origin", "http://localhost:3003"]

  operator:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: frontend-operator
    networks:
      net_internal:
        ipv4_address: 10.32.0.20
      net_secure:
        ipv4_address: 10.33.0.20
    extra_hosts:
      - "g8e.local:10.32.0.10"
    volumes:
      - operator_state:/root/.g8e
    depends_on:
      gateway:
        condition: service_healthy
    working_dir: /root
    healthcheck:
      test: ["CMD", "test", "-f", "/root/.g8e/pki/operator.crt"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: ["operator", "start", "-e", "10.32.0.10"]

  frontend-app:
    image: nginx@sha256:54f2a904c251d5a34adf545a72d32515a15e08418dae0266e23be2e18c66fefa
    container_name: frontend-app
    networks:
      net_perimeter:
        ipv4_address: 10.31.0.20
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "3003:80"
    volumes:
      - ./app:/usr/share/nginx/html:ro

  observability:
    image: alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    container_name: frontend-observability
    networks:
      net_mgmt:
    volumes:
      - gateway_state:/data/gateway:ro
      - operator_state:/data/operator:ro
    command: ["sh", "-c", "until [ -f /data/gateway/logs/operator.log ]; do sleep 2; done; tail -f /data/gateway/logs/operator.log"]
