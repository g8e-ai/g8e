<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>g8e Frontend Enrollment Demo</title>
    <style>
        :root {
            --bg: #0f1117;
            --panel: #1a1d27;
            --border: #2a2d3a;
            --text: #e4e6eb;
            --muted: #8b8fa3;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --success: #22c55e;
            --error: #ef4444;
            --warn: #f59e0b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 24px;
            min-height: 100vh;
        }
        h1 { font-size: 1.5rem; margin-bottom: 4px; }
        .subtitle { color: var(--muted); font-size: 0.875rem; margin-bottom: 24px; }
        .status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 16px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--muted);
            transition: background 0.3s;
        }
        .status-dot.online { background: var(--success); }
        .status-dot.offline { background: var(--error); }
        .status-text { font-size: 0.875rem; color: var(--muted); }
        .actions {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 20px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: background 0.2s;
        }
        button:hover:not(:disabled) { background: var(--accent-hover); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button.secondary { background: var(--panel); border: 1px solid var(--border); }
        button.secondary:hover:not(:disabled) { border-color: var(--accent); }
        .session-info {
            padding: 12px 16px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 0.8125rem;
            color: var(--muted);
            display: none;
        }
        .session-info.active { display: block; }
        .session-info code { color: var(--accent-hover); }
        .log-panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            height: 400px;
            overflow-y: auto;
            padding: 16px;
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            font-size: 0.8125rem;
            line-height: 1.6;
        }
        .log-entry { padding: 2px 0; }
        .log-entry.info { color: var(--text); }
        .log-entry.success { color: var(--success); }
        .log-entry.error { color: var(--error); }
        .log-entry.warn { color: var(--warn); }
        .log-entry.event { color: var(--accent-hover); }
        .log-entry .ts { color: var(--muted); margin-right: 8px; }
    </style>
</head>
<body>
    <h1>g8e Frontend Enrollment Demo</h1>
    <p class="subtitle">Third-party application demonstrating WebAuthn passkey auth and SSE live events</p>

    <div class="status-bar">
        <div class="status-dot" id="statusDot"></div>
        <span class="status-text" id="statusText">Checking gateway...</span>
    </div>

    <div class="actions">
        <button id="btnRegister" onclick="registerPasskey()" disabled>Register Passkey</button>
        <button id="btnAuth" onclick="authenticatePasskey()" disabled>Authenticate</button>
        <button id="btnSSE" class="secondary" onclick="toggleSSE()" disabled>Connect SSE</button>
    </div>

    <div class="session-info" id="sessionInfo">
        Session ID: <code id="sessionId"></code>
    </div>

    <div class="log-panel" id="logPanel">
        <div class="log-entry info"><span class="ts">--:--:--</span>Waiting for gateway...</div>
    </div>

    <script>
        const API_BASE = 'https://localhost:8446';
        const HTTP_BASE = 'http://localhost:8083';
        let webSessionId = null;
        let eventSource = null;

        // Base64url helpers for WebAuthn
        function bufToB64url(buf) {
            const bytes = new Uint8Array(buf);
            let str = '';
            for (const b of bytes) str += String.fromCharCode(b);
            return btoa(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }
        function b64urlToBuf(b64url) {
            const pad = '='.repeat((4 - b64url.length % 4) % 4);
            const b64 = (b64url + pad).replace(/-/g, '+').replace(/_/g, '/');
            const str = atob(b64);
            const bytes = new Uint8Array(str.length);
            for (let i = 0; i < str.length; i++) bytes[i] = str.charCodeAt(i);
            return bytes.buffer;
        }

        function log(msg, level) {
            level = level || 'info';
            const panel = document.getElementById('logPanel');
            const now = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = 'log-entry ' + level;
            entry.innerHTML = '<span class="ts">' + now + '</span>' + msg;
            panel.appendChild(entry);
            panel.scrollTop = panel.scrollHeight;
        }

        async function apiFetch(path, options) {
            options = options || {};
            options.credentials = 'include';
            options.headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
            const res = await fetch(API_BASE + path, options);
            return res;
        }

        async function checkHealth() {
            try {
                const res = await fetch(HTTP_BASE + '/api/v1/health');
                if (res.ok) {
                    document.getElementById('statusDot').className = 'status-dot online';
                    document.getElementById('statusText').textContent = 'Gateway online';
                    document.getElementById('btnRegister').disabled = false;
                    document.getElementById('btnAuth').disabled = false;
                    document.getElementById('btnSSE').disabled = false;
                    log('Gateway health check passed', 'success');
                } else {
                    throw new Error('HTTP ' + res.status);
                }
            } catch (e) {
                document.getElementById('statusDot').className = 'status-dot offline';
                document.getElementById('statusText').textContent = 'Gateway offline';
                log('Gateway health check failed: ' + e.message, 'error');
                setTimeout(checkHealth, 3000);
            }
        }

        async function registerPasskey() {
            log('Starting passkey registration...', 'info');
            try {
                const challengeRes = await apiFetch('/api/v1/auth/passkeys/console/register/challenge', {
                    method: 'POST',
                    body: JSON.stringify({})
                });
                if (!challengeRes.ok) {
                    const body = await challengeRes.text();
                    log('Challenge request failed: ' + challengeRes.status + ' ' + body, 'error');
                    return;
                }
                const challengeData = await challengeRes.json();
                log('Received registration challenge', 'success');

                const publicKey = {
                    challenge: b64urlToBuf(challengeData.challenge),
                    rp: {
                        id: challengeData.rpId || 'localhost',
                        name: challengeData.rpName || 'g8e'
                    },
                    user: {
                        id: b64urlToBuf(challengeData.user.id),
                        name: challengeData.user.name,
                        displayName: challengeData.user.displayName
                    },
                    pubKeyCredParams: challengeData.pubKeyCredParams || [
                        { type: 'public-key', alg: -7 },
                        { type: 'public-key', alg: -257 }
                    ],
                    authenticatorSelection: {
                        authenticatorAttachment: 'platform',
                        userVerification: 'preferred'
                    }
                };

                const credential = await navigator.credentials.create({ publicKey });
                log('Passkey created by authenticator', 'success');

                const verifyRes = await apiFetch('/api/v1/auth/passkeys/console/register/verify', {
                    method: 'POST',
                    body: JSON.stringify({
                        id: credential.id,
                        rawId: bufToB64url(credential.rawId),
                        type: credential.type,
                        response: {
                            attestationObject: bufToB64url(credential.response.attestationObject),
                            clientDataJSON: bufToB64url(credential.response.clientDataJSON)
                        }
                    })
                });

                if (verifyRes.ok) {
                    const verifyData = await verifyRes.json();
                    log('Passkey registration verified: ' + JSON.stringify(verifyData), 'success');
                } else {
                    const body = await verifyRes.text();
                    log('Registration verification failed: ' + verifyRes.status + ' ' + body, 'error');
                }
            } catch (e) {
                log('Registration error: ' + e.message, 'error');
            }
        }

        async function authenticatePasskey() {
            log('Starting passkey authentication...', 'info');
            try {
                const challengeRes = await apiFetch('/api/v1/auth/passkeys/console/authenticate/challenge', {
                    method: 'POST',
                    body: JSON.stringify({})
                });
                if (!challengeRes.ok) {
                    const body = await challengeRes.text();
                    log('Auth challenge failed: ' + challengeRes.status + ' ' + body, 'error');
                    return;
                }
                const challengeData = await challengeRes.json();
                log('Received authentication challenge', 'success');

                const publicKey = {
                    challenge: b64urlToBuf(challengeData.challenge),
                    rpId: challengeData.rpId || 'localhost',
                    userVerification: 'preferred',
                    allowCredentials: challengeData.allowCredentials || []
                };

                const credential = await navigator.credentials.get({ publicKey });
                log('Passkey authentication completed', 'success');

                const verifyRes = await apiFetch('/api/v1/auth/passkeys/console/authenticate/verify', {
                    method: 'POST',
                    body: JSON.stringify({
                        id: credential.id,
                        rawId: bufToB64url(credential.rawId),
                        type: credential.type,
                        response: {
                            authenticatorData: bufToB64url(credential.response.authenticatorData),
                            clientDataJSON: bufToB64url(credential.response.clientDataJSON),
                            signature: bufToB64url(credential.response.signature)
                        }
                    })
                });

                if (verifyRes.ok) {
                    const verifyData = await verifyRes.json();
                    webSessionId = verifyData.web_session_id || verifyData.session_id;
                    if (webSessionId) {
                        document.getElementById('sessionId').textContent = webSessionId;
                        document.getElementById('sessionInfo').className = 'session-info active';
                    }
                    log('Authentication verified: ' + JSON.stringify(verifyData), 'success');
                } else {
                    const body = await verifyRes.text();
                    log('Auth verification failed: ' + verifyRes.status + ' ' + body, 'error');
                }
            } catch (e) {
                log('Authentication error: ' + e.message, 'error');
            }
        }

        function toggleSSE() {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
                log('SSE stream closed', 'warn');
                document.getElementById('btnSSE').textContent = 'Connect SSE';
                return;
            }

            if (!webSessionId) {
                log('No session ID — authenticate first', 'warn');
                return;
            }

            // Security: web_session_id is NEVER passed in the URL. The gateway
            // derives it from the authenticated session cookie.
            const url = API_BASE + '/api/v1/sse/stream';
            eventSource = new EventSource(url, { withCredentials: true });

            eventSource.onopen = function() {
                log('SSE stream connected', 'success');
                document.getElementById('btnSSE').textContent = 'Disconnect SSE';
            };

            eventSource.onmessage = function(ev) {
                log('SSE event: ' + ev.data, 'event');
            };

            eventSource.onerror = function() {
                log('SSE connection error — reconnecting in 3s', 'error');
                eventSource.close();
                eventSource = null;
                document.getElementById('btnSSE').textContent = 'Connect SSE';
                setTimeout(function() {
                    if (webSessionId) toggleSSE();
                }, 3000);
            };
        }

        checkHealth();
    </script>
</body>
</html>
