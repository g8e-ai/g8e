name: gov-demo

networks:
  net_untrusted:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.0.0/24
  net_perimeter:
    driver: bridge
    ipam:
      config:
        - subnet: 10.21.0.0/24
  net_internal:
    driver: bridge
    ipam:
      config:
        - subnet: 10.22.0.0/24
  net_secure:
    driver: bridge
    ipam:
      config:
        - subnet: 10.23.0.0/24
  net_mgmt:
    driver: bridge
    ipam:
      config:
        - subnet: 10.24.0.0/24

volumes:
  gateway_state:
  operator_state:
  target_state:

services:
  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: gov-gateway
    networks:
      net_perimeter:
        ipv4_address: 10.21.0.10
      net_internal:
        ipv4_address: 10.22.0.10
    volumes:
      - gateway_state:/root/.g8e
      - ./doctrine:/etc/g8e/doctrine:ro
    ports:
      - "8080:8080"
      - "8443:8443"
    working_dir: /root
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: ["gw", "start", "-f"]

  operator:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: gov-operator
    networks:
      net_internal:
        ipv4_address: 10.22.0.20
      net_secure:
        ipv4_address: 10.23.0.20
    extra_hosts:
      - "g8e.local:10.22.0.10"
    volumes:
      - operator_state:/root/.g8e
    depends_on:
      gateway:
        condition: service_healthy
    working_dir: /root
    healthcheck:
      test: ["CMD", "test", "-f", "/root/.g8e/pki/operator.crt"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: ["operator", "run", "-e", "10.22.0.10"]

  target-system:
    image: alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    container_name: gov-target
    networks:
      net_secure:
        ipv4_address: 10.23.0.30
    volumes:
      - target_state:/var/target
      - ./target-data:/var/g8e/target:ro
    depends_on:
      operator:
        condition: service_healthy
    command: ["sh", "-c", "while true; do sleep 3600; done"]

  agent-runtime:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: gov-agent
    networks:
      net_internal:
    extra_hosts:
      - "g8e.local:10.22.0.10"
    volumes:
      - operator_state:/root/.g8e:ro
    depends_on:
      gateway:
        condition: service_healthy
      operator:
        condition: service_healthy
    working_dir: /root
    entrypoint: ["sh", "-c", "sleep infinity"]

  demo-ui:
    image: nginx@sha256:54f2a904c251d5a34adf545a72d32515a15e08418dae0266e23be2e18c66fefa
    container_name: gov-demo-ui
    networks:
      net_perimeter:
        ipv4_address: 10.21.0.20
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "3000:80"
    command: ["nginx", "-g", "daemon off;"]

  bad-actor:
    image: alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    container_name: gov-bad-actor
    networks:
      net_untrusted:
    command: ["sh", "-c", "while true; do sleep 3600; done"]

  observability:
    image: alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    container_name: gov-observability
    networks:
      net_mgmt:
    volumes:
      - gateway_state:/data/gateway:ro
      - operator_state:/data/operator:ro
    command: ["sh", "-c", "until [ -f /data/gateway/logs/operator.log ]; do sleep 2; done; tail -f /data/gateway/logs/operator.log"]
