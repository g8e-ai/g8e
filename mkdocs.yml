site_name: g8e Documentation
site_description: Zero-trust execution substrate for agentic infrastructure
site_author: g8e.ai
site_url: https://docs.g8e.ai

docs_dir: docs
site_dir: site

# Repository
repo_name: g8e-ai/g8e
repo_url: https://github.com/g8e-ai/g8e

# Copyright
copyright: Copyright &copy; 2026 Lateralus Labs, LLC

# Theme
theme:
  name: material
  palette:
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
  font:
    text: false
    code: false

# Plugins
plugins:
  - search:
      lang: en

# Extensions
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

# Navigation
nav:
  - Home: index.md
  - Architecture:
      - About: core/about.md
      - Position Paper: core/position_paper.md
      - Operator: architecture/operator.md
      - Governance Gateway: architecture/gateway.md
      - Protocol: architecture/protocol.md
      - Codemap: architecture/codemap.md
  - Protocols:
      - g8e Protocol: protocols/g8e/g8e.md
      - Architecture Protocol: architecture/protocol.md
      - MCP Protocol: protocols/mcp/mcp.md
      - A2A Protocol: protocols/a2a/a2a.md
  - Guides:
      - Getting Started: guides/getting_started.md
      - Build Gateway: guides/build_gateway.md
      - Connect Apps to Gateway: guides/connect_apps_to_gateway.md
      - Build Operator: guides/build_operator.md
      - Connect Operator to Gateway: guides/connect_operator_to_gateway.md
      - Build Apps: guides/build_apps.md
      - Air Gap: guides/air_gap.md
      - CLI Reference: guides/cli.md
  - Reference:
      - API:
          - API Overview: reference/api/index.md
          - Common v1: reference/api/g8e/common/v1/index.md
          - Operator v1: reference/api/g8e/operator/v1/index.md
          - PubSub v1: reference/api/g8e/pubsub/v1/index.md
      - Constants: reference/constants.md
      - Glossary: reference/glossary.md
  - Developer:
      - Developer Guidelines: devs/devs.md
      - Testing: devs/tests.md
      - Troubleshooting: devs/troubleshooting.md
