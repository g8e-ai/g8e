# Unified stack: gateway, data operator, inference operator, ensemble, and
# dashboard start together in the default profile (`docker compose up -d`).
# Workloads submit platform enrollment requests and become ready once approved
# by the owner.
#
# Binary precedence:
# Host binaries in ./bin are mounted read-only at /opt/g8e/bin. When present,
# a local `make build` takes immediate precedence across all internal services.
# Restarting the operators (`docker compose restart g8e-operator g8e-inference-operator`)
# aligns operator versions immediately without rebuilding images. If no host
# binary is present, the image baked-in binary (/g8e) is used automatically.
# See docs/guides/unified_stack.md.

networks:
  g8e-net:
    name: g8e-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  g8e-gateway-data:
    driver: local
  g8e-operator-data:
    driver: local
  g8e-ensemble-data:
    driver: local
  g8e-dashboard-data:
    driver: local
  g8e-gateway-secondary-data:
    driver: local
  g8e-gateway-user-data:
    driver: local
  g8e-inference-data:
    driver: local
  g8e-shared-tmp:
    driver: local

services:
  g8e-gateway:
    # Policy Decision Point: admits transactions, manages PKI, enforces L1-L3 governance.
    image: g8e-gateway
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${G8E_PREFIX:-g8e}-gateway
    working_dir: /root
    networks:
      g8e-net:
        aliases:
          - g8e.local
          - g8eg
    volumes:
      - g8e-gateway-data:/root/.g8e
      - ./dashboard/g8e-adapter/evaluation-explorer/dist:/eval-explorer:ro
      - g8e-shared-tmp:/tmp
      - ./bin:/opt/g8e/bin:ro
      - /etc/hosts:/etc/hosts.host:ro
      - /etc/hostname:/etc/hostname.host:ro
    ports:
      - "${G8E_HTTP_PORT:-8080}:8080"
      - "${G8E_HTTPS_PORT:-8443}:8443"
      - "127.0.0.1:${G8E_PUBLIC_MIRROR_PRIVATE_PORT:-8081}:8081"
      - "127.0.0.1:${G8E_PUBLIC_MIRROR_PUBLIC_PORT:-8082}:8082"
      - "127.0.0.1:${G8E_EVAL_EXPLORER_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      - G8E_PUBLIC_BASE_URL=${G8E_PUBLIC_BASE_URL:-https://${G8E_HOSTNAME:-localhost}:${G8E_HTTPS_PORT:-8443}}
      - G8E_DOCKER_COMPOSE=1
      - G8E_EVAL_EXPLORER_ROOT=/eval-explorer
    command:
      - "gw"
      - "start"
      - "-f"
      - "--log"
      - "info"
      - "--public-spectator"
      - "--public-spectator-private-listen"
      - "0.0.0.0:8081"
      - "--public-spectator-public-listen"
      - "0.0.0.0:8082"
      - "--public-spectator-trusted-proxy-cidr"
      - "172.28.0.1/32"
      - "--eval-explorer-listen"
      - "0.0.0.0:5173"
      - "--cors-origin"
      - "http://${G8E_HOSTNAME:-localhost}:${G8E_DASHBOARD_PORT:-3000}"
      - "--passkey-rp-origin"
      - "http://${G8E_HOSTNAME:-localhost}:${G8E_DASHBOARD_PORT:-3000}"
      - "--passkey-rp-id"
      - "${G8E_HOSTNAME:-localhost}"
      - "--passkey-rp-name"
      - "g8e"
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 16384
        hard: 16384
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 512M

  g8e-operator:
    # Policy Execution Point: outbound-only mTLS to the gateway. Same image as the gateway.
    # Data Operator for governed tool/filesystem/process boundaries.
    image: g8e-gateway
    container_name: ${G8E_PREFIX:-g8e}-operator
    working_dir: /root
    networks:
      - g8e-net
    volumes:
      - g8e-operator-data:/root/.g8e
      - g8e-shared-tmp:/tmp
      - ./bin:/opt/g8e/bin:ro
    depends_on:
      g8e-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/root/.g8e/pki/operator.crt"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: ["operator", "start", "-e", "g8e.local", "--heartbeat-interval", "${G8E_HEARTBEAT_INTERVAL_SECONDS:-30}"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  g8e-inference-operator:
    # Campaign Inference Operator: enrolls to the primary campaign Gateway
    # (g8e.local) as a distinct inference-capable remote Operator with its own
    # runtime volume and session identity. Satisfies the exact-two-Operator
    # evaluation topology.
    image: g8e-gateway
    container_name: ${G8E_PREFIX:-g8e}-inference-operator
    hostname: inference-operator
    working_dir: /root
    networks:
      g8e-net:
        aliases:
          - g8e-inference-operator
    volumes:
      - g8e-inference-data:/root/.g8e
      - g8e-shared-tmp:/tmp
      - ./bin:/opt/g8e/bin:ro
    depends_on:
      g8e-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/root/.g8e/pki/operator.crt"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command:
      - "operator"
      - "start"
      - "-e"
      - "g8e.local"
      - "--inference-enabled"
      - "--inference-ollama-endpoint"
      - "${G8E_OLLAMA_ENDPOINT:-http://127.0.0.1:11434}"
      - "--inference-primary-model"
      - "${G8E_INFERENCE_PRIMARY_MODEL:-gemm4:e4b}"
      - "--inference-assistant-model"
      - "${G8E_INFERENCE_ASSISTANT_MODEL:-qwen3:1.7b}"
      - "--inference-lite-model"
      - "${G8E_INFERENCE_LITE_MODEL:-smol-7b:latest}"
      - "--inference-keep-alive"
      - "${G8E_INFERENCE_KEEP_ALIVE:--1}"
      - "--inference-campaign-id"
      - "${G8E_INFERENCE_CAMPAIGN_ID:-}"
      - "--inference-model-registry-digest"
      - "${G8E_INFERENCE_MODEL_REGISTRY_DIGEST:-}"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 1G

  g8e-gateway-secondary:
    # Cross-enrollment secondary gateway: runs the same image in operator mode
    # (-e g8e.local) so its in-process operator substrate enrolls against the
    # primary gateway. Activated via the `cross-enrollment` profile.
    profiles: [cross-enrollment]
    image: g8e-gateway
    container_name: ${G8E_PREFIX:-g8e}-gateway-secondary
    hostname: gateway-secondary
    working_dir: /root
    networks:
      g8e-net:
        aliases:
          - g8e-secondary
    volumes:
      - g8e-gateway-secondary-data:/root/.g8e
      - g8e-shared-tmp:/tmp
      - ./bin:/opt/g8e/bin:ro
    depends_on:
      g8e-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/root/.g8e/pki/operator.crt"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: ["operator", "start", "-e", "g8e.local", "--heartbeat-interval", "${G8E_HEARTBEAT_INTERVAL_SECONDS:-30}"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  ensemble:
    # First-party agentic ensemble (g8ee): Python/FastAPI. Submits governed intents via MCP.
    build:
      context: .
      dockerfile: ensemble/Dockerfile
    container_name: ${G8E_PREFIX:-g8e}-ensemble
    networks:
      - g8e-net
    depends_on:
      g8e-gateway:
        condition: service_healthy
      g8e-operator:
        condition: service_started
    ports:
      - "${G8E_ENSEMBLE_PORT:-8000}:8000"
    volumes:
      - g8e-ensemble-data:/root/.g8e
      - g8e-operator-data:/operator-state:ro
      - g8e-shared-tmp:/tmp
    environment:
      - G8E_GATEWAY_HTTP_URL=http://g8e.local:8080
      - G8E_GATEWAY_URL=https://g8e.local:8443
      - G8E_OPERATOR_URL=https://g8e.local:8443
      - G8E_OPERATOR_PUBSUB_URL=wss://g8e.local:8443
      - G8E_RUNTIME_DIR=/root/.g8e
      - G8E_SECRETS_DIR=/operator-state/secrets
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  dashboard:
    # Operator dashboard (g8ed): Node.js/Express browser UI. Runs as non-root g8e user (UID 1001).
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: ${G8E_PREFIX:-g8e}-dashboard
    networks:
      - g8e-net
    ports:
      - "${G8E_DASHBOARD_PORT:-3000}:3000"
    depends_on:
      g8e-gateway:
        condition: service_healthy
    volumes:
      - g8e-dashboard-data:/data
    environment:
      - GATEWAY_HEALTH_URL=http://g8eg:8080
      - GATEWAY_HEALTH_PATH=/api/v1/health
      - G8E_GATEWAY_URL=https://${G8E_HOSTNAME:-localhost}:${G8E_HTTPS_PORT:-8443}
      - G8E_GATEWAY_HTTP_URL=http://g8eg:8080
      - G8E_RUNTIME_DIR=/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ===========================================================================
  # g8ellama — governed inference against the approved remote Ollama provider.
  #
  # Two services under the `g8ellama` profile: a User Gateway (where the user
  # or IDE connects) and an Inference Node (operator mode) that enrolls as an
  # outbound operator of the User Gateway via the existing cross-enrollment
  # path (`operator start -e <user-gateway>`).
  # Activate with:
  #   G8E_OLLAMA_ENDPOINT=http://<approved-remote>:11434 \
  #     docker compose --profile g8ellama up -d
  # ===========================================================================

  g8e-gateway-user:
    # User Gateway: owns the state Merkle root, governance posture, and dispatch.
    profiles: [g8ellama]
    image: g8e-gateway
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${G8E_PREFIX:-g8e}-gateway-user
    hostname: gateway-user
    working_dir: /root
    networks:
      g8e-net:
        aliases:
          - g8e-user
    volumes:
      - g8e-gateway-user-data:/root/.g8e
      - g8e-shared-tmp:/tmp
      - ./bin:/opt/g8e/bin:ro
    ports:
      - "${G8E_USER_HTTP_PORT:-8090}:8080"
      - "${G8E_USER_HTTPS_PORT:-8453}:8443"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      - G8E_PUBLIC_BASE_URL=https://${G8E_USER_HOSTNAME:-localhost}:${G8E_USER_HTTPS_PORT:-8453}
    command:
      - "gw"
      - "start"
      - "-f"
      - "--log"
      - "info"
      - "--cors-origin"
      - "http://${G8E_USER_HOSTNAME:-localhost}:${G8E_USER_DASHBOARD_PORT:-3001}"
      - "--passkey-rp-origin"
      - "http://${G8E_USER_HOSTNAME:-localhost}:${G8E_USER_DASHBOARD_PORT:-3001}"
      - "--passkey-rp-id"
      - "${G8E_USER_HOSTNAME:-localhost}"
      - "--passkey-rp-name"
      - "g8e-user"
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  g8e-inference:
    # Inference Node: gateway binary in operator mode (`operator start -e g8e-user`).
    profiles: [g8ellama]
    image: g8e-gateway
    container_name: ${G8E_PREFIX:-g8e}-inference
    hostname: inference
    working_dir: /root
    networks:
      g8e-net:
        aliases:
          - g8e-inference
    volumes:
      - g8e-inference-data:/root/.g8e
      - g8e-shared-tmp:/tmp
      - ./bin:/opt/g8e/bin:ro
    depends_on:
      g8e-gateway-user:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/root/.g8e/pki/operator.crt"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command:
      - "operator"
      - "start"
      - "-e"
      - "g8e-user"
      - "--inference-enabled"
      - "--inference-ollama-endpoint"
      - "${G8E_OLLAMA_ENDPOINT:?set G8E_OLLAMA_ENDPOINT to the approved remote Ollama provider}"
      - "--inference-primary-model"
      - "${G8E_INFERENCE_PRIMARY_MODEL:-gemm4:e4b}"
      - "--inference-assistant-model"
      - "${G8E_INFERENCE_ASSISTANT_MODEL:-qwen3:1.7b}"
      - "--inference-lite-model"
      - "${G8E_INFERENCE_LITE_MODEL:-smol-7b:latest}"
      - "--inference-keep-alive"
      - "${G8E_INFERENCE_KEEP_ALIVE:--1}"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 1G
