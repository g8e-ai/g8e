networks:
  g8e-net:
    driver: bridge

volumes:
  g8e-gateway-data:
    driver: local
  g8e-operator-data:
    driver: local

services:
  g8e-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${G8E_PREFIX:-g8e}-gateway
    working_dir: /root
    networks:
      g8e-net:
        aliases:
          - g8e.local
    volumes:
      - g8e-gateway-data:/root/.g8e
    ports:
      - "${G8E_HTTP_PORT:-8080}:8080"
      - "${G8E_HTTPS_PORT:-8443}:8443"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    command: ["gw", "start", "-f"]
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  g8e-operator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${G8E_PREFIX:-g8e}-operator
    working_dir: /root
    networks:
      - g8e-net
    volumes:
      - g8e-operator-data:/root/.g8e
    depends_on:
      g8e-gateway:
        condition: service_healthy
    # g8e.local resolves to the gateway container via the g8e-net network alias
    command: ["operator", "start", "-e", "g8e.local"]
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
