services:
  g8e-operator:
    build:
      context: .
      dockerfile: Dockerfile.operator
    container_name: g8e-operator

    # Set working directory so .g8e resolves correctly
    working_dir: /root

    # Volume mounts for runtime data and configuration
    volumes:
      # Mount .g8e directory for runtime state (certificates, database, etc.)
      - g8e-operator-data:/root/.g8e

    # Use host network to connect to local gateway
    network_mode: host

    # Run operator connecting to gateway at 192.168.1.62
    # Uses -e flag to specify gateway endpoint
    command: ["-e", "192.168.1.62"]

    # Restart policy - don't auto-restart to prevent enrollment loops
    restart: "no"

    # Note: Gateway should be running on host machine at localhost:8080
    # The operator uses host network to connect to it

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

volumes:
  g8e-operator-data:
    driver: local
