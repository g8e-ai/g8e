networks:
  g8e-net:
    driver: bridge

volumes:
  g8e-gateway-data:
    driver: local
  g8e-operator-data:
    driver: local

services:
  g8e-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${G8E_PREFIX:-g8e}-gateway
    working_dir: /root
    networks:
      g8e-net:
        aliases:
          - g8e.local
          - g8edb
    volumes:
      - g8e-gateway-data:/root/.g8e
    ports:
      - "${G8E_HTTP_PORT:-8080}:8080"
      - "${G8E_HTTPS_PORT:-8443}:8443"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    command:
      - "gw"
      - "start"
      - "-f"
      - "--cors-origin"
      - "http://localhost:${G8E_DASHBOARD_PORT:-3000}"
      - "--passkey-rp-origin"
      - "http://localhost:${G8E_DASHBOARD_PORT:-3000}"
      - "--passkey-rp-id"
      - "localhost"
      - "--passkey-rp-name"
      - "g8e"
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  g8e-operator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${G8E_PREFIX:-g8e}-operator
    working_dir: /root
    networks:
      - g8e-net
    volumes:
      - g8e-operator-data:/root/.g8e
    depends_on:
      g8e-gateway:
        condition: service_healthy
    # g8e.local resolves to the gateway container via the g8e-net network alias
    command: ["operator", "start", "-e", "g8e.local"]
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  ensemble:
    build:
      context: .
      dockerfile: ensemble/Dockerfile
    container_name: ${G8E_PREFIX:-g8e}-ensemble
    networks:
      - g8e-net
    depends_on:
      g8e-gateway:
        condition: service_healthy
      g8e-operator:
        condition: service_started
    ports:
      - "${G8E_ENSEMBLE_PORT:-8000}:8000"
    volumes:
      # Mount the gateway's data volume read-only so the ensemble can read its
      # issued app cert/key (pki/issued/apps/g8ee.crt, g8ee.key) and the trust
      # bundle (pki/trust/g8eg-ca-bundle.pem) for mTLS to the gateway and
      # operator. The gateway's working_dir is /root and paths.Init() sets
      # RuntimeDir = /root/.g8e, so the gateway's runtime tree lives at
      # /root/.g8e/ inside this volume. The ensemble's G8E_RUNTIME_DIR is
      # set to /root/.g8e to align with this path.
      - g8e-gateway-data:/root/.g8e:ro
    environment:
      - G8E_GATEWAY_URL=https://g8e.local:8443
      # The ensemble's DB/KV/PubSub/Blob clients connect to the gateway's
      # document store API (the env var is named G8E_OPERATOR_URL for historical
      # reasons — in "Operator Gateway mode" the operator proxies these APIs,
      # but in this deployment the gateway exposes them directly at g8e.local:8443).
      # Without this env var the clients default to localhost:8443 (the ensemble
      # container itself) and fail to connect.
      - G8E_OPERATOR_URL=https://g8e.local:8443
      - G8E_OPERATOR_PUBSUB_URL=wss://g8e.local:8443
      # The gateway's working_dir is /root and it calls paths.Init() which
      # sets RuntimeDir = cwd + "/.g8e" = /root/.g8e. The volume is mounted at
      # /root/.g8e, so the gateway's runtime tree is /root/.g8e/. The ensemble
      # must point at the same runtime tree to find the gateway's PKI certs.
      - G8E_RUNTIME_DIR=/root/.g8e
      - G8E_PKI_DIR=/root/.g8e/pki
      # The gateway produces its trust bundle at pki/trust/g8eg-ca-bundle.pem
      # inside its runtime tree. Override the ensemble's ca_cert_path so mTLS
      # verification uses the gateway's CA bundle. See EnvVar.CA_CERT_PATH and
      # paths._load_paths().
      - G8E_CA_CERT_PATH=/root/.g8e/pki/trust/g8eg-ca-bundle.pem
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: ${G8E_PREFIX:-g8e}-dashboard
    networks:
      - g8e-net
    ports:
      - "${G8E_DASHBOARD_PORT:-3000}:3000"
    depends_on:
      g8e-gateway:
        condition: service_healthy
    environment:
      - GATEWAY_HEALTH_URL=http://g8edb:8080
      - GATEWAY_HEALTH_PATH=/api/v1/health
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
