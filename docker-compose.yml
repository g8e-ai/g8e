# Two-phase startup: only the gateway starts by default (no profile). The
# operator, dashboard, and ensemble are in the `bootstrapped` profile and require
# a human to enroll the first owner before they can start. After enrolling,
# run `docker compose --profile bootstrapped up -d` to bring up the workloads.
# See docs/guides/unified_stack.md for the full bootstrap flow and
# docs/guides/docker_gateway.md for the per-service details.

networks:
  g8e-net:
    name: g8e-net
    driver: bridge

volumes:
  g8e-gateway-data:
    driver: local
  g8e-operator-data:
    driver: local
  g8e-ensemble-data:
    driver: local
  g8e-dashboard-data:
    driver: local
  g8e-gateway-secondary-data:
    driver: local
  g8e-gateway-user-data:
    driver: local
  g8e-inference-data:
    driver: local
  g8e-data-operator-data:
    driver: local
  g8e-ollama-models:
    driver: local
  g8e-shared-tmp:
    driver: local

services:
  g8e-gateway:
    # Policy Decision Point: admits transactions, manages PKI, enforces L1-L3 governance.
    image: g8e-gateway
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${G8E_PREFIX:-g8e}-gateway
    working_dir: /root
    networks:
      g8e-net:
        aliases:
          - g8e.local
          - g8eg
    volumes:
      - g8e-gateway-data:/root/.g8e
      - g8e-shared-tmp:/tmp
      - /etc/hosts:/etc/hosts.host:ro
      - /etc/hostname:/etc/hostname.host:ro
    ports:
      - "${G8E_HTTP_PORT:-8080}:8080"
      - "${G8E_HTTPS_PORT:-8443}:8443"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      - G8E_PUBLIC_BASE_URL=https://${G8E_HOSTNAME:-localhost}:${G8E_HTTPS_PORT:-8443}
    command:
      - "gw"
      - "start"
      - "-f"
      - "--cors-origin"
      - "http://${G8E_HOSTNAME:-localhost}:${G8E_DASHBOARD_PORT:-3000}"
      - "--passkey-rp-origin"
      - "http://${G8E_HOSTNAME:-localhost}:${G8E_DASHBOARD_PORT:-3000}"
      - "--passkey-rp-id"
      - "${G8E_HOSTNAME:-localhost}"
      - "--passkey-rp-name"
      - "g8e"
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  g8e-operator:
    # Policy Execution Point: outbound-only mTLS to the gateway. Same image as the gateway.
    # Requires owner enrollment before starting — use `docker compose --profile bootstrapped up -d`.
    profiles: [bootstrapped]
    image: g8e-gateway
    container_name: ${G8E_PREFIX:-g8e}-operator
    working_dir: /root
    networks:
      - g8e-net
    volumes:
      - g8e-operator-data:/root/.g8e
      - g8e-shared-tmp:/tmp
    depends_on:
      g8e-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/root/.g8e/pki/operator.crt"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: ["operator", "start", "-e", "g8e.local"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  g8e-gateway-secondary:
    # Cross-enrollment secondary gateway: runs the same image in operator mode
    # (-e g8e.local) so its in-process operator substrate enrolls against the
    # primary gateway. This exercises the gateway-as-operator path: a gateway
    # binary enrolling as an operator of another gateway. Activated via the
    # `cross-enrollment` profile — use
    # `docker compose --profile bootstrapped --profile cross-enrollment up -d`.
    # The container opens no inbound ports (operator mode is outbound-only
    # mTLS to the primary gateway), so no port mapping is needed.
    profiles: [cross-enrollment]
    image: g8e-gateway
    container_name: ${G8E_PREFIX:-g8e}-gateway-secondary
    hostname: gateway-secondary
    working_dir: /root
    networks:
      g8e-net:
        aliases:
          - g8e-secondary
    volumes:
      - g8e-gateway-secondary-data:/root/.g8e
      - g8e-shared-tmp:/tmp
    depends_on:
      g8e-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/root/.g8e/pki/operator.crt"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: ["operator", "start", "-e", "g8e.local"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  ensemble:
    # First-party agentic ensemble (g8ee): Python/FastAPI. Submits governed intents via MCP.
    # Requires owner enrollment before starting — use `docker compose --profile bootstrapped up -d`.
    profiles: [bootstrapped]
    build:
      context: .
      dockerfile: ensemble/Dockerfile
    container_name: ${G8E_PREFIX:-g8e}-ensemble
    networks:
      - g8e-net
    depends_on:
      g8e-gateway:
        condition: service_healthy
      g8e-operator:
        condition: service_started
    ports:
      - "${G8E_ENSEMBLE_PORT:-8000}:8000"
    volumes:
      - g8e-ensemble-data:/root/.g8e
      # Read-only mount of the operator's enrolled mTLS credentials so the
      # ensemble can submit governance envelopes using the operator's cert
      # (whose SPIFFE URI carries the operator session ID, bypassing the
      # gateway's PrivilegedRouteRegistry block on app certs). See
      # docs/guides/unified_stack.md and the v1.2.2 "Operator Cert Sharing"
      # release notes. Mounted at /operator-state to avoid colliding with the
      # ensemble's own /root/.g8e runtime tree.
      - g8e-operator-data:/operator-state:ro
      - g8e-shared-tmp:/tmp
    environment:
      - G8E_GATEWAY_HTTP_URL=http://g8e.local:8080
      - G8E_GATEWAY_URL=https://g8e.local:8443
      - G8E_OPERATOR_URL=https://g8e.local:8443
      - G8E_OPERATOR_PUBSUB_URL=wss://g8e.local:8443
      - G8E_RUNTIME_DIR=/root/.g8e
      - G8E_SECRETS_DIR=/operator-state/secrets
      - G8E_GOVERNANCE_OPERATOR_CERT=/operator-state/pki/operator.crt
      - G8E_GOVERNANCE_OPERATOR_KEY=/operator-state/pki/operator.key
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  dashboard:
    # Operator dashboard (g8ed): Node.js/Express browser UI. Runs as non-root g8e user (UID 1001).
    # Requires owner enrollment before starting — use `docker compose --profile bootstrapped up -d`.
    profiles: [bootstrapped]
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: ${G8E_PREFIX:-g8e}-dashboard
    networks:
      - g8e-net
    ports:
      - "${G8E_DASHBOARD_PORT:-3000}:3000"
    depends_on:
      g8e-gateway:
        condition: service_healthy
    volumes:
      - g8e-dashboard-data:/data
    environment:
      - GATEWAY_HEALTH_URL=http://g8eg:8080
      - GATEWAY_HEALTH_PATH=/api/v1/health
      - G8E_GATEWAY_URL=https://${G8E_HOSTNAME:-localhost}:${G8E_HTTPS_PORT:-8443}
      - G8E_GATEWAY_HTTP_URL=http://g8eg:8080
      - G8E_RUNTIME_DIR=/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ===========================================================================
  # g8ellama — three-node governed local inference topology.
  #
  # Four services under the `g8ellama` profile: a User Gateway (where the user
  # or IDE connects), an Inference Node (operator mode with a co-located
  # Ollama daemon), a Data Operator (operator mode with a mounted data
  # volume), and the Ollama daemon itself. The Inference Node and Data
  # Operator enroll as outbound operators of the User Gateway via the
  # existing cross-enrollment path (`operator start -e <user-gateway>`).
  # Activate with:
  #   docker compose --profile g8ellama up -d
  # ===========================================================================

  g8e-gateway-user:
    # User Gateway: owns the state Merkle root, governance posture, and
    # dispatch. Routes governed envelopes to the Inference Node or the Data
    # Operator by operator session via DispatchService.Dispatch. Same image
    # as the default gateway, running `gw start` under the g8ellama profile
    # so it can run alongside the default `g8e-gateway` on distinct ports.
    profiles: [g8ellama]
    image: g8e-gateway
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${G8E_PREFIX:-g8e}-gateway-user
    hostname: gateway-user
    working_dir: /root
    networks:
      g8e-net:
        aliases:
          - g8e-user
    volumes:
      - g8e-gateway-user-data:/root/.g8e
      - g8e-shared-tmp:/tmp
    ports:
      - "${G8E_USER_HTTP_PORT:-8090}:8080"
      - "${G8E_USER_HTTPS_PORT:-8453}:8443"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      - G8E_PUBLIC_BASE_URL=https://${G8E_USER_HOSTNAME:-localhost}:${G8E_USER_HTTPS_PORT:-8453}
    command:
      - "gw"
      - "start"
      - "-f"
      - "--cors-origin"
      - "http://${G8E_USER_HOSTNAME:-localhost}:${G8E_USER_DASHBOARD_PORT:-3001}"
      - "--passkey-rp-origin"
      - "http://${G8E_USER_HOSTNAME:-localhost}:${G8E_USER_DASHBOARD_PORT:-3001}"
      - "--passkey-rp-id"
      - "${G8E_USER_HOSTNAME:-localhost}"
      - "--passkey-rp-name"
      - "g8e-user"
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  g8e-inference:
    # Inference Node: gateway binary in operator mode (`operator start -e
    # g8e-user`) so its operator substrate enrolls against the User Gateway.
    # Runs a co-located Ollama client (the Ollama daemon is the separate
    # `ollama` service) and executes governed inference requests through the
    # full L1-L5 gauntlet on-host. Inference is enabled via the
    # `--inference-enabled` flag; the Ollama endpoint points at the `ollama`
    # service on the shared network. Operator mode is outbound-only mTLS to
    # the User Gateway, so no inbound port mapping is needed.
    profiles: [g8ellama]
    image: g8e-gateway
    container_name: ${G8E_PREFIX:-g8e}-inference
    hostname: inference
    working_dir: /root
    networks:
      g8e-net:
        aliases:
          - g8e-inference
    volumes:
      - g8e-inference-data:/root/.g8e
      - g8e-shared-tmp:/tmp
    depends_on:
      g8e-gateway-user:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "test", "-f", "/root/.g8e/pki/operator.crt"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_NUM_PARALLEL=${G8E_INFERENCE_NUM_PARALLEL:-1}
    command:
      - "operator"
      - "start"
      - "-e"
      - "g8e-user"
      - "--inference-enabled"
      - "--inference-ollama-endpoint"
      - "http://ollama:11434"
      - "--inference-primary-model"
      - "${G8E_INFERENCE_PRIMARY_MODEL:-qwen3:4b}"
      - "--inference-assistant-model"
      - "${G8E_INFERENCE_ASSISTANT_MODEL:-qwen3:1.7b}"
      - "--inference-lite-model"
      - "${G8E_INFERENCE_LITE_MODEL:-qwen3:0.6b}"
      - "--inference-keep-alive"
      - "${G8E_INFERENCE_KEEP_ALIVE:--1}"
      - "--inference-num-parallel"
      - "${G8E_INFERENCE_NUM_PARALLEL:-1}"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 1G

  g8e-data-operator:
    # Data Operator: standard outbound operator with filesystem access to the
    # governed data. Enrolls against the User Gateway via `operator start -e
    # g8e-user`. No new code; deployment configuration only. Operator mode is
    # outbound-only mTLS to the User Gateway, so no inbound port mapping is
    # needed.
    profiles: [g8ellama]
    image: g8e-gateway
    container_name: ${G8E_PREFIX:-g8e}-data-operator
    hostname: data-operator
    working_dir: /root
    networks:
      g8e-net:
        aliases:
          - g8e-data-operator
    volumes:
      - g8e-data-operator-data:/root/.g8e
      - ${G8E_DATA_VOLUME:-g8e-shared-tmp}:/data:ro
      - g8e-shared-tmp:/tmp
    depends_on:
      g8e-gateway-user:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/root/.g8e/pki/operator.crt"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: ["operator", "start", "-e", "g8e-user"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  ollama:
    # Ollama inference daemon. Owns process lifecycle, VRAM management, model
    # eviction, and multi-model residency. The Inference Node's gateway binary
    # is the sole client over the shared `g8e-net` network. The model store
    # volume persists pulled/staged models; for air-gapped deployments, models
    # are pre-staged into this volume and registered offline (see Phase 5).
    # OLLAMA_KEEP_ALIVE=-1 pins all three chat roles in memory; OLLAMA_NUM_PARALLEL
    # sets the concurrent inference slot count.
    profiles: [g8ellama]
    image: ollama/ollama:0.9
    container_name: ${G8E_PREFIX:-g8e}-ollama
    hostname: ollama
    networks:
      g8e-net:
        aliases:
          - ollama
    volumes:
      - g8e-ollama-models:/root/.ollama
    ports:
      - "${G8E_OLLAMA_PORT:-11434}:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_NUM_PARALLEL=${G8E_INFERENCE_NUM_PARALLEL:-1}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 2G
