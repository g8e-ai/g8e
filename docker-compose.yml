networks:
  g8e-net:
    name: g8e-net
    driver: bridge

volumes:
  g8e-gateway-data:
    driver: local
  g8e-operator-data:
    driver: local
  g8e-ensemble-data:
    driver: local
  g8e-dashboard-data:
    driver: local

services:
  g8e-gateway:
    image: g8e-gateway
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${G8E_PREFIX:-g8e}-gateway
    working_dir: /root
    networks:
      g8e-net:
        aliases:
          - g8e.local
          - g8eg
    volumes:
      - g8e-gateway-data:/root/.g8e
    ports:
      - "${G8E_HTTP_PORT:-8080}:8080"
      - "${G8E_HTTPS_PORT:-8443}:8443"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      # Public base URL the gateway advertises in approval links, host-header
      # validation, and other browser-facing surfaces. Defaults to localhost;
      # set G8E_HOSTNAME in .env (e.g. dev.g8e.local) when the browser reaches
      # the gateway via a real hostname.
      - G8E_PUBLIC_BASE_URL=https://${G8E_HOSTNAME:-localhost}:${G8E_HTTPS_PORT:-8443}
    command:
      - "gw"
      - "start"
      - "-f"
      - "--cors-origin"
      - "http://${G8E_HOSTNAME:-localhost}:${G8E_DASHBOARD_PORT:-3000}"
      - "--passkey-rp-origin"
      - "http://${G8E_HOSTNAME:-localhost}:${G8E_DASHBOARD_PORT:-3000}"
      - "--passkey-rp-id"
      - "${G8E_HOSTNAME:-localhost}"
      - "--passkey-rp-name"
      - "g8e"
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  g8e-operator:
    # The operator tier is opt-in via the `activated` compose profile. The
    # gateway starts with zero users and refuses operator enrollment until a
    # human has bootstrapped it via `auth enroll user` (activated: true). The
    # default `docker compose up` starts only the gateway and dashboard; bring
    # up the operator + ensemble after enrolling:
    #   docker compose up -d
    #   ./g8e auth enroll user -e <gateway>
    #   docker compose --profile activated up -d
    profiles:
      - activated
    image: g8e-operator
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${G8E_PREFIX:-g8e}-operator
    working_dir: /root
    networks:
      - g8e-net
    volumes:
      - g8e-operator-data:/root/.g8e
    depends_on:
      g8e-gateway:
        condition: service_healthy
    # g8e.local resolves to the gateway container via the g8e-net network alias
    command: ["operator", "start", "-e", "g8e.local"]
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  ensemble:
    # Part of the `activated` profile — brought up alongside the operator
    # after the gateway is activated. See g8e-operator above for the flow.
    profiles:
      - activated
    build:
      context: .
      dockerfile: ensemble/Dockerfile
    container_name: ${G8E_PREFIX:-g8e}-ensemble
    networks:
      - g8e-net
    depends_on:
      g8e-gateway:
        condition: service_healthy
      g8e-operator:
        condition: service_started
    ports:
      - "${G8E_ENSEMBLE_PORT:-8000}:8000"
    volumes:
      # The ensemble has its own runtime volume. It self-enrolls via the
      # gateway's public PKI app enrollment endpoint at startup and stores its
      # enrolled cert/key/trust-bundle in its own runtime tree. No gateway
      # volume is mounted — the ensemble is a proper enrolled app, not a
      # volume-mount shortcut.
      - g8e-ensemble-data:/root/.g8e
    environment:
      # The gateway's plain-HTTP bootstrap surface for app enrollment and
      # CA bundle fetch. The enrollment service (AppEnrollmentService) reads
      # this at startup to self-enroll before the operator clients connect.
      - G8E_GATEWAY_HTTP_URL=http://g8e.local:8080
      # The ensemble's DB/KV/PubSub/Blob clients connect to the gateway's
      # document store API (the env var is named G8E_OPERATOR_URL for historical
      # reasons — in "Operator Gateway mode" the operator proxies these APIs,
      # but in this deployment the gateway exposes them directly at g8e.local:8443).
      - G8E_OPERATOR_URL=https://g8e.local:8443
      - G8E_OPERATOR_PUBSUB_URL=wss://g8e.local:8443
      # The ensemble's own runtime directory inside its own volume. PATHS
      # resolution derives pki_dir and secrets_dir from this, so the
      # enrollment service writes to /root/.g8e/pki/... inside the ensemble's
      # own g8e-ensemble-data volume.
      - G8E_RUNTIME_DIR=/root/.g8e
    healthcheck:
      # The ensemble runtime image is python:3.12-slim, which has no wget or
      # curl. Python is already present, so the healthcheck uses a stdlib
      # urllib one-liner instead of adding packages to the image.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: ${G8E_PREFIX:-g8e}-dashboard
    networks:
      - g8e-net
    ports:
      - "${G8E_DASHBOARD_PORT:-3000}:3000"
    depends_on:
      g8e-gateway:
        condition: service_healthy
    volumes:
      # The dashboard has its own runtime volume. It self-enrolls at startup
      # via the gateway's public PKI app enrollment endpoint (same contract
      # the ensemble uses) and stores its enrolled cert/key/trust-bundle in
      # its own runtime tree. No gateway volume is mounted — the dashboard
      # is a proper enrolled app, not a volume-mount shortcut. The browser
      # still authenticates via WebAuthn passkeys; this credential is for
      # the container's server-to-server mTLS calls.
      #
      # Mounted at /data (not /root/.g8e) because the dashboard container
      # runs as the non-root g8e user (UID 1001); /data is created and
      # chowned to g8e:g8e in the Dockerfile, so the named volume inherits
      # that ownership on first creation. /root/.g8e is root's home and not
      # writable by the g8e user.
      - g8e-dashboard-data:/data
    environment:
      - GATEWAY_HEALTH_URL=http://g8eg:8080
      - GATEWAY_HEALTH_PATH=/api/v1/health
      # Browser-facing gateway origin. The browser resolves this against its
      # own host, so it must be the host-accessible address (not the docker
      # internal service name). No fallback — the SPA host fails closed if
      # this is unset.
      - G8E_GATEWAY_URL=https://${G8E_HOSTNAME:-localhost}:${G8E_HTTPS_PORT:-8443}
      # The gateway's plain-HTTP bootstrap surface for app enrollment and CA
      # bundle fetch. The AppEnrollmentService reads this at startup to
      # self-enroll before the Express server listens. Uses the gateway's
      # docker network alias on the plain-HTTP port (same surface as
      # GATEWAY_HEALTH_URL). No fallback — fail closed if unset.
      - G8E_GATEWAY_HTTP_URL=http://g8eg:8080
      # The dashboard's own runtime directory inside its own volume. The
      # enrollment service writes pki/issued/apps/g8ed.crt and friends here.
      # /data is owned by the g8e user (UID 1001) per the Dockerfile; the
      # volume is mounted there.
      - G8E_RUNTIME_DIR=/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
