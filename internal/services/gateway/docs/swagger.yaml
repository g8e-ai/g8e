    - indirect
    - direct
    - enterprise
    type: string
    x-enum-varnames:
    - PreferNoAttestation
    - PreferIndirectAttestation
    - PreferDirectAttestation
    - PreferEnterpriseAttestation
  protocol.CredentialAssertion:
    properties:
      mediation:
        $ref: '#/definitions/protocol.CredentialMediationRequirement'
      publicKey:
        $ref: '#/definitions/protocol.PublicKeyCredentialRequestOptions'
    type: object
  protocol.CredentialCreation:
    properties:
      mediation:
        $ref: '#/definitions/protocol.CredentialMediationRequirement'
      publicKey:
        $ref: '#/definitions/protocol.PublicKeyCredentialCreationOptions'
    type: object
  protocol.CredentialDescriptor:
    properties:
      id:
        description: CredentialID The ID of a credential to allow/disallow.
        items:
          type: integer
        type: array
      transports:
        description: The authenticator transports that can be used.
        items:
          $ref: '#/definitions/protocol.AuthenticatorTransport'
        type: array
      type:
        allOf:
        - $ref: '#/definitions/protocol.CredentialType'
        description: The valid credential types.
    type: object
  protocol.CredentialMediationRequirement:
    enum:
    - ""
    - silent
    - optional
    - conditional
    - required
    type: string
    x-enum-varnames:
    - MediationDefault
    - MediationSilent
    - MediationOptional
    - MediationConditional
    - MediationRequired
  protocol.CredentialParameter:
    properties:
      alg:
        $ref: '#/definitions/webauthncose.COSEAlgorithmIdentifier'
      type:
        $ref: '#/definitions/protocol.CredentialType'
    type: object
  protocol.CredentialProtectionPolicy:
    enum:
    - userVerificationOptional
    - userVerificationOptionalWithCredentialIDList
    - userVerificationRequired
    type: string
    x-enum-varnames:
    - CredentialProtectionPolicyUserVerificationOptional
    - CredentialProtectionPolicyUserVerificationOptionalWithCredentialIDList
    - CredentialProtectionPolicyUserVerificationRequired
  protocol.CredentialType:
    enum:
    - public-key
    type: string
    x-enum-varnames:
    - PublicKeyCredentialType
  protocol.HMACGetSecretInputs:
    properties:
      salt1:
        items:
          type: integer
        type: array
      salt2:
        items:
          type: integer
        type: array
    type: object
  protocol.LargeBlobInputs:
    properties:
      read:
        type: boolean
      support:
        $ref: '#/definitions/protocol.LargeBlobSupport'
      write:
        items:
          type: integer
        type: array
    type: object
  protocol.LargeBlobSupport:
    enum:
    - required
    - preferred
    type: string
    x-enum-varnames:
    - LargeBlobSupportRequired
    - LargeBlobSupportPreferred
  protocol.PRFInputs:
    properties:
      eval:
        $ref: '#/definitions/protocol.PRFValues'
      evalByCredential:
        additionalProperties:
          $ref: '#/definitions/protocol.PRFValues'
        type: object
    type: object
  protocol.PRFValues:
    properties:
      first:
        items:
          type: integer
        type: array
      second:
        items:
          type: integer
        type: array
    type: object
  protocol.PublicKeyCredentialCreationOptions:
    properties:
      attestation:
        $ref: '#/definitions/protocol.ConveyancePreference'
      attestationFormats:
        items:
          $ref: '#/definitions/protocol.AttestationFormat'
        type: array
      authenticatorSelection:
        $ref: '#/definitions/protocol.AuthenticatorSelection'
      challenge:
        items:
          type: integer
        type: array
      excludeCredentials:
        items:
          $ref: '#/definitions/protocol.CredentialDescriptor'
        type: array
      extensions:
        $ref: '#/definitions/protocol.AuthenticationExtensions'
      hints:
        items:
          $ref: '#/definitions/protocol.PublicKeyCredentialHints'
        type: array
      pubKeyCredParams:
        items:
          $ref: '#/definitions/protocol.CredentialParameter'
        type: array
      rp:
        $ref: '#/definitions/protocol.RelyingPartyEntity'
      timeout:
        type: integer
      user:
        $ref: '#/definitions/protocol.UserEntity'
    type: object
  protocol.PublicKeyCredentialHints:
    enum:
    - security-key
    - client-device
    - hybrid
    type: string
    x-enum-varnames:
    - PublicKeyCredentialHintSecurityKey
    - PublicKeyCredentialHintClientDevice
    - PublicKeyCredentialHintHybrid
  protocol.PublicKeyCredentialRequestOptions:
    properties:
      allowCredentials:
        items:
          $ref: '#/definitions/protocol.CredentialDescriptor'
        type: array
      challenge:
        items:
          type: integer
        type: array
      extensions:
        $ref: '#/definitions/protocol.AuthenticationExtensions'
      hints:
        items:
          $ref: '#/definitions/protocol.PublicKeyCredentialHints'
        type: array
      rpId:
        type: string
      timeout:
        type: integer
      userVerification:
        $ref: '#/definitions/protocol.UserVerificationRequirement'
    type: object
  protocol.RelyingPartyEntity:
    properties:
      id:
        description: A unique identifier for the Relying Party entity, which sets
          the RP ID.
        type: string
      name:
        description: |-
          A human-palatable name for the entity. Its function depends on what the PublicKeyCredentialEntity represents:

          When inherited by PublicKeyCredentialRpEntity it is a human-palatable identifier for the Relying Party,
          intended only for display. For example, "ACME Corporation", "Wonderful Widgets, Inc." or "ОАО Примертех".

          When inherited by PublicKeyCredentialUserEntity, it is a human-palatable identifier for a user account. It is
          intended only for display, i.e., aiding the user in determining the difference between user accounts with similar
          displayNames. For example, "alexm", "alex.p.mueller@example.com" or "+14255551234".
        type: string
    type: object
  protocol.ResidentKeyRequirement:
    enum:
    - discouraged
    - preferred
    - required
    type: string
    x-enum-varnames:
    - ResidentKeyRequirementDiscouraged
    - ResidentKeyRequirementPreferred
    - ResidentKeyRequirementRequired
  protocol.UserEntity:
    properties:
      displayName:
        description: |-
          A human-palatable name for the user account, intended only for display.
          For example, "Alex P. Müller" or "田中 倫". The Relying Party SHOULD let
          the user choose this, and SHOULD NOT restrict the choice more than necessary.
        type: string
      id:
        description: |-
          ID is the user handle of the user account entity. To ensure secure operation,
          authentication and authorization decisions MUST be made on the basis of this id
          member, not the displayName nor name members. See Section 6.1 of
          [RFC8266](https://www.w3.org/TR/webauthn/#biblio-rfc8266).
      name:
        description: |-
          A human-palatable name for the entity. Its function depends on what the PublicKeyCredentialEntity represents:

          When inherited by PublicKeyCredentialRpEntity it is a human-palatable identifier for the Relying Party,
          intended only for display. For example, "ACME Corporation", "Wonderful Widgets, Inc." or "ОАО Примертех".

          When inherited by PublicKeyCredentialUserEntity, it is a human-palatable identifier for a user account. It is
          intended only for display, i.e., aiding the user in determining the difference between user accounts with similar
          displayNames. For example, "alexm", "alex.p.mueller@example.com" or "+14255551234".
        type: string
    type: object
  protocol.UserVerificationRequirement:
    enum:
    - required
    - preferred
    - discouraged
    type: string
    x-enum-comments:
      VerificationPreferred: This is the default.
    x-enum-descriptions:
    - ""
    - This is the default.
    - ""
    x-enum-varnames:
    - VerificationRequired
    - VerificationPreferred
    - VerificationDiscouraged
  webauthncose.COSEAlgorithmIdentifier:
    enum:
    - -7
    - -8
    - -9
    - -19
    - -35
    - -36
    - -37
    - -38
    - -39
    - -47
    - -51
    - -52
    - -257
    - -258
    - -259
    - -65535
    type: integer
    x-enum-varnames:
    - AlgES256
    - AlgEdDSA
    - AlgESP256
    - AlgEd25519
    - AlgES384
    - AlgES512
    - AlgPS256
    - AlgPS384
    - AlgPS512
    - AlgES256K
    - AlgESP384
    - AlgESP512
    - AlgRS256
    - AlgRS384
    - AlgRS512
    - AlgRS1
info:
  contact: {}
paths:
  /:
    get:
      consumes:
      - text/html
      description: Returns the public landing page for the gateway
      produces:
      - text/html
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Landing page
      tags:
      - public
  /.well-known/g8e/bin/{filename}:
    get:
      description: Downloads the g8e binary file binary for the current platform (internal
        endpoint)
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
      summary: Download node binary
      tags:
      - bootstrap
  /.well-known/g8e/pki/ca-bundle:
    get:
      consumes:
      - application/json
      description: Returns the platform's root CA certificate bundle for trust establishment
      produces:
      - application/x-pem-file
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Get CA bundle
      tags:
      - pki
  /.well-known/g8e/pki/crl:
    get:
      consumes:
      - application/json
      description: Returns the certificate revocation list
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get CRL
      tags:
      - pki
  /.well-known/g8e/pki/fingerprint:
    get:
      consumes:
      - application/json
      description: Returns the platform's PKI fingerprint for verification
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get PKI fingerprint
      tags:
      - pki
  /api/v1/approvals:
    get:
      description: Lists suspended transactions pending L3 passkey approval for the
        authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SuspendedTransactionsResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
      summary: List pending approvals
      tags:
      - approvals
  /api/v1/approvals/{txHash}/challenge:
    get:
      description: Generates a WebAuthn assertion challenge for approving a suspended
        transaction.
      parameters:
      - description: Transaction hash
        in: path
        name: txHash
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: WebAuthn assertion options
          schema:
            items:
              type: integer
            type: array
        "403":
          description: Forbidden — belongs to another user
          schema:
            type: string
        "404":
          description: Transaction not found or expired
          schema:
            type: string
      summary: Get approval challenge
      tags:
      - approvals
  /api/v1/approvals/{txHash}/verify:
    post:
      consumes:
      - application/json
      description: |-
        Verifies a WebAuthn assertion response to approve a suspended transaction. On success,
        the transaction resumes execution with the L3 proof attached and an SSE event is emitted.
      parameters:
      - description: Transaction hash
        in: path
        name: txHash
        required: true
        type: string
      - description: WebAuthn assertion response
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.WebAuthnAssertionResponse'
      produces:
      - application/json
      responses:
        "200":
          description: Canonical protojson ActionReceipt
          schema:
            $ref: '#/definitions/operatorv1.ActionReceipt'
        "403":
          description: Forbidden — verification failed
          schema:
            type: string
        "404":
          description: Transaction not found or expired
          schema:
            type: string
      summary: Verify approval
      tags:
      - approvals
  /api/v1/audit/receipts:
    get:
      description: Returns one canonical protojson ActionReceipt when tx_id is set
        or when investigation_id and action_type uniquely correlate a receipt. Without
        those selectors, returns searchable receipt records with the complete receipt
        nested under action_receipt.
      parameters:
      - description: Transaction ID for a single canonical ActionReceipt
        in: query
        name: tx_id
        type: string
      - description: Investigation ID for a unique correlation lookup
        in: query
        name: investigation_id
        type: string
      - description: Action type required with investigation_id
        in: query
        name: action_type
        type: string
      - description: Operator session filter for list results
        in: query
        name: operator_session_id
        type: string
      - description: Maximum list results
        in: query
        name: limit
        type: integer
      - description: List offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List wrapper; unique selectors instead return a bare operatorv1.ActionReceipt
          schema:
            $ref: '#/definitions/models.AuditReceiptsResponse'
        "400":
          description: Bad Request — conflicting or incomplete selectors
          schema:
            type: string
        "404":
          description: Receipt not found
          schema:
            type: string
        "405":
          description: Method Not Allowed
          schema:
            type: string
        "409":
          description: Conflict — correlation matched multiple receipts
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get or list audit receipts
      tags:
      - audit
  /api/v1/audit/receipts/export:
    get:
      description: Returns an AuditReceiptsResponse list wrapper. Every searchable
        record embeds the complete canonical protojson receipt under action_receipt.
      parameters:
      - description: Inclusive receipt timestamp in RFC3339 format
        in: query
        name: since
        type: string
      - description: Operator session filter
        in: query
        name: operator_session_id
        type: string
      - description: Maximum results
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AuditReceiptsResponse'
        "405":
          description: Method Not Allowed
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Export audit receipts
      tags:
      - audit
  /api/v1/auth/logout:
    post:
      description: Clears the web session cookie and deletes the session from the
        database.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.StatusResponse'
      summary: Logout
      tags:
      - auth
  /api/v1/auth/passkeys:
    get:
      consumes:
      - application/json
      description: Lists all WebAuthn credentials for the authenticated user. Identity
        comes from the auth context.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PasskeyCredentialsResponse'
      summary: List passkey credentials
      tags:
      - passkey
  /api/v1/auth/passkeys/{id}:
    delete:
      consumes:
      - application/json
      description: Revokes a WebAuthn credential by ID. Identity comes from the auth
        context.
      parameters:
      - description: Credential ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PasskeyRevokeResponse'
      summary: Revoke passkey credential
      tags:
      - passkey
  /api/v1/auth/passkeys/authenticate/challenge:
    post:
      consumes:
      - application/json
      description: |-
        Generates a WebAuthn authentication challenge. Config-driven trust posture:
        mTLS (session-user binding), CLI bootstrap (public), or console (public).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PasskeyChallengeResponse'
      summary: Generate WebAuthn authentication challenge
      tags:
      - passkey
  /api/v1/auth/passkeys/authenticate/verify:
    post:
      consumes:
      - application/json
      description: |-
        Verifies a WebAuthn assertion response. Config-driven trust posture:
        mTLS (session-user binding, may mint web session in body), CLI bootstrap (public), or console (public, may mint web session + cookie).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PasskeyAuthVerifyResponse'
      summary: Verify WebAuthn authentication
      tags:
      - passkey
  /api/v1/auth/passkeys/cli/status:
    get:
      consumes:
      - application/json
      description: Returns the passkey credential list for the mTLS-authenticated
        user. Identity comes from the mTLS auth context; user_id query params are
        ignored.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PasskeyCredentialsResponse'
      summary: CLI passkey status
      tags:
      - passkey
  /api/v1/auth/passkeys/register/challenge:
    post:
      consumes:
      - application/json
      description: |-
        Generates a WebAuthn registration challenge. Config-driven trust posture:
        mTLS (session-user binding), JIT (first-credential-only), CLI bootstrap (public), console (public, may auto-create user),
        or enrollment-token (public, token-gated — the CLI enrollment flow).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PasskeyRegisterChallengeResponse'
      summary: Generate WebAuthn registration challenge
      tags:
      - passkey
  /api/v1/auth/passkeys/register/verify:
    post:
      consumes:
      - application/json
      description: |-
        Verifies a WebAuthn attestation response and stores the credential. Config-driven trust posture:
        mTLS (session-user binding), JIT (first-credential-only), CLI bootstrap (public), console (public, may mint web session + cookie),
        or enrollment-token (public, token-gated — the CLI enrollment flow).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PasskeyVerifyResponse'
      summary: Verify WebAuthn registration
      tags:
      - passkey
  /api/v1/auth/sessions/me:
    get:
      description: Returns the authenticated user's ID and web session ID from the
        session cookie.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.WebSessionResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
      summary: Get current web session
      tags:
      - auth
  /api/v1/data/blobs/{namespace}/{id}:
    get:
      description: Retrieves a blob from the data store
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
      summary: Get blob
      tags:
      - data
  /api/v1/governance/envelopes:
    post:
      consumes:
      - application/json
      description: |-
        Accepts a GovernanceEnvelope, verifies it through the 5-layer gauntlet (L1–L3 pre-flight,
        L4 warden, L5 actuator), and returns the signed ActionReceipt. Transport-to-envelope
        identity binding is enforced via mTLS certificate URI SAN matching.
      parameters:
      - description: GovernanceEnvelope (protojson)
        in: body
        name: envelope
        required: true
        schema:
          items:
            type: integer
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: Canonical protojson ActionReceipt
          schema:
            $ref: '#/definitions/operatorv1.ActionReceipt'
        "400":
          description: Bad Request — malformed envelope
          schema:
            type: string
        "403":
          description: Forbidden — governance verification failed
          schema:
            type: string
        "405":
          description: Method Not Allowed
          schema:
            type: string
        "503":
          description: Service Unavailable — processor not configured
          schema:
            type: string
      summary: Submit governance envelope
      tags:
      - governance
  /api/v1/operators/validate:
    post:
      consumes:
      - application/json
      description: Validates the exact active operator-session, CLI-session, and user
        binding. The Gateway is authoritative; callers authenticate with an enrolled
        application mTLS certificate.
      parameters:
      - description: Operator, CLI, and user session binding
        in: body
        name: binding
        required: true
        schema:
          $ref: '#/definitions/models.OperatorSessionValidationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.OperatorSessionValidationResponse'
        "400":
          description: Bad Request — malformed JSON
          schema:
            type: string
        "401":
          description: Unauthorized — binding is missing, inactive, expired, or mismatched
          schema:
            type: string
        "403":
          description: Forbidden — application mTLS identity is not authorized
          schema:
            type: string
        "405":
          description: Method Not Allowed
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Validate operator session binding
      tags:
      - operators
  /api/v1/pki/apps/delegated:
    post:
      consumes:
      - application/json
      description: Mints a short-lived delegated credential for an app, binding both
        app and requestor identities (mTLS-authenticated)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gateway.AppEnrollResponse'
      summary: Mint delegated app credential
      tags:
      - pki
  /api/v1/pki/certificates/revoke:
    post:
      consumes:
      - application/json
      description: Revokes a certificate by serial number (internal mTLS endpoint)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.StatusResponse'
      summary: Revoke certificate
      tags:
      - pki
  /api/v1/pki/csr/sign:
    post:
      consumes:
      - application/json
      description: Signs a certificate signing request (internal mTLS endpoint)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PKICSRSignResponse'
      summary: Sign CSR
      tags:
      - pki
  /api/v1/pki/devices/enroll:
    post:
      consumes:
      - application/json
      description: Enrolls a device via PKI endpoint
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: PKI device enrollment
      tags:
      - pki
  /api/v1/sse/events:
    get:
      description: |-
        Polls stored SSE events since a given ID. Dual auth: mTLS for CLI/operator, web session
        cookie for browser. The route is built entirely from auth context: user_id from
        cert/cookie, session from header/cookie. The query string carries only since_id and limit.
      parameters:
      - description: CLI session ID (mTLS only — user_id derived from cert)
        in: header
        name: X-G8E-CLI-Session-ID
        type: string
      - description: Return events after this ID
        in: query
        name: since_id
        type: integer
      - description: Maximum events to return
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SSEEventsResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "403":
          description: Forbidden — unauthorized
          schema:
            type: string
      summary: Poll SSE events
      tags:
      - telemetry
  /api/v1/sse/push:
    post:
      consumes:
      - application/json
      description: |-
        Appends an event to the SSE event store and publishes it to the pub/sub channel.
        Requires mTLS app workload identity. user_id is required, plus exactly one
        of web_session_id or cli_session_id as the delivery target.
      parameters:
      - description: SSE push payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/models.SSEPushPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SSEPushResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized — mTLS required
          schema:
            type: string
        "403":
          description: Forbidden — not app workload or unauthorized target
          schema:
            type: string
      summary: Push SSE event
      tags:
      - telemetry
  /api/v1/sse/stream:
    get:
      description: |-
        Streams events via Server-Sent Events (text/event-stream). Dual auth: mTLS for
        CLI/operator, web session cookie for browser. Supports Last-Event-ID header for
        reconnection. The route is built entirely from auth context: user_id from cert/cookie,
        session from header/cookie. The query string carries only since_id.
      parameters:
      - description: CLI session ID (mTLS only — user_id derived from cert)
        in: header
        name: X-G8E-CLI-Session-ID
        type: string
      - description: Replay events after this ID
        in: query
        name: since_id
        type: integer
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE stream
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "403":
          description: Forbidden — unauthorized
          schema:
            type: string
      summary: Stream SSE events
      tags:
      - telemetry
  /api/v1/users:
    get:
      consumes:
      - application/json
      description: |-
        GET lists all users; POST creates a new user with a generated ID.
        Zero-PII: users are created with only a generated ID and passkey credentials.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.User'
            type: array
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.UserCreateResponse'
        "405":
          description: Method Not Allowed
          schema:
            type: string
        "409":
          description: Conflict — user creation failed
          schema:
            type: string
      summary: List or create users
      tags:
      - users
    post:
      consumes:
      - application/json
      description: |-
        GET lists all users; POST creates a new user with a generated ID.
        Zero-PII: users are created with only a generated ID and passkey credentials.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.User'
            type: array
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.UserCreateResponse'
        "405":
          description: Method Not Allowed
          schema:
            type: string
        "409":
          description: Conflict — user creation failed
          schema:
            type: string
      summary: List or create users
      tags:
      - users
  /api/v1/users/me:
    get:
      description: |-
        Returns the authenticated user's profile. Identity comes from the auth context
        (mTLS or web session cookie).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.UserMeResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: User not found
          schema:
            type: string
      summary: Get current user
      tags:
      - users
  /console/:
    get:
      consumes:
      - text/html
      description: Serves the single-page application dashboard for WebAuthn/passkey
