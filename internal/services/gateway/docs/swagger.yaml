            $ref: '#/definitions/models.EvalDetail'
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Eval not found
          schema:
            type: string
      summary: Get observe eval detail
      tags:
      - observe
  /api/v1/observe/producer/agent-state:
    post:
      consumes:
      - application/json
      description: Accepts a typed agent state update from an mTLS-authenticated app
        workload (the g8ee ensemble). The gateway derives user_id from the peer certificate,
        persists the agent state projection, and emits an app.agent.status.updated
        SSE event after successful persistence.
      parameters:
      - description: Agent state update
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/models.ObserveProducerAgentStateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: accepted
          schema:
            type: string
        "400":
          description: Invalid transition, stale update, or missing fields
          schema:
            type: string
        "401":
          description: Unauthorized — mTLS user identity required
          schema:
            type: string
        "403":
          description: Forbidden — not an app workload or cross-user
          schema:
            type: string
        "500":
          description: Persistence failure
          schema:
            type: string
      summary: Push observe agent state
      tags:
      - observe
