      monotonic_start_ns:
        type: integer
      operator_id:
        type: string
      operator_session_id:
        type: string
      outcome:
        $ref: '#/definitions/operatorv1.DeterministicStageOutcome'
      parent_stage_id:
        type: string
      prior_commitment_hash:
        type: string
      receipt_signature_digest:
        type: string
      requestor_user_id:
        type: string
      signer_key_id:
        type: string
      stage_id:
        type: string
      state_root_after:
        type: string
      state_root_before:
        type: string
      task_id:
        type: string
      timing_source:
        type: string
      transaction_hash:
        type: string
      transaction_id:
        type: string
    type: object
  operatorv1.DeterministicStageKind:
    enum:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    format: int32
    type: integer
    x-enum-varnames:
    - DeterministicStageKind_DETERMINISTIC_STAGE_KIND_UNSPECIFIED
    - DeterministicStageKind_DETERMINISTIC_STAGE_KIND_L1_DOCTRINE
    - DeterministicStageKind_DETERMINISTIC_STAGE_KIND_PROTOCOL_L2
    - DeterministicStageKind_DETERMINISTIC_STAGE_KIND_L3_NOTARY
    - DeterministicStageKind_DETERMINISTIC_STAGE_KIND_L4_VERIFICATION
    - DeterministicStageKind_DETERMINISTIC_STAGE_KIND_RECEIPT_PERSISTENCE
    - DeterministicStageKind_DETERMINISTIC_STAGE_KIND_COMMITMENT_APPEND
    - DeterministicStageKind_DETERMINISTIC_STAGE_KIND_L5_EXECUTION
  operatorv1.DeterministicStageOutcome:
    enum:
    - 0
    - 1
    - 2
    - 3
    - 4
    format: int32
    type: integer
    x-enum-varnames:
    - DeterministicStageOutcome_DETERMINISTIC_STAGE_OUTCOME_UNSPECIFIED
    - DeterministicStageOutcome_DETERMINISTIC_STAGE_OUTCOME_VERIFIED
    - DeterministicStageOutcome_DETERMINISTIC_STAGE_OUTCOME_NOT_REQUIRED
    - DeterministicStageOutcome_DETERMINISTIC_STAGE_OUTCOME_COMPLETED
    - DeterministicStageOutcome_DETERMINISTIC_STAGE_OUTCOME_FAILED
  operatorv1.ExecutionStatus:
    enum:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    format: int32
    type: integer
    x-enum-varnames:
    - ExecutionStatus_EXECUTION_STATUS_UNSPECIFIED
    - ExecutionStatus_EXECUTION_STATUS_EXECUTING
    - ExecutionStatus_EXECUTION_STATUS_COMPLETED
    - ExecutionStatus_EXECUTION_STATUS_FAILED
    - ExecutionStatus_EXECUTION_STATUS_CANCELLED
    - ExecutionStatus_EXECUTION_STATUS_TIMEOUT
  operatorv1.L2Status:
    enum:
    - 0
    - 1
    - 2
    - 3
    format: int32
    type: integer
    x-enum-comments:
      L2Status_L2_STATUS_NOT_REQUIRED: L2 signature not required by posture (doctrine/ratify)
      L2Status_L2_STATUS_REQUIRED_FAILED: L2 signature required but missing or invalid
      L2Status_L2_STATUS_REQUIRED_VALID: L2 signature required and valid
    x-enum-descriptions:
    - ""
    - L2 signature not required by posture (doctrine/ratify)
    - L2 signature required and valid
    - L2 signature required but missing or invalid
    x-enum-varnames:
    - L2Status_L2_STATUS_UNSPECIFIED
    - L2Status_L2_STATUS_NOT_REQUIRED
    - L2Status_L2_STATUS_REQUIRED_VALID
    - L2Status_L2_STATUS_REQUIRED_FAILED
  operatorv1.L3Status:
    enum:
    - 0
    - 1
    - 2
    - 3
    format: int32
    type: integer
    x-enum-comments:
      L3Status_L3_STATUS_NOT_REQUIRED: L3 proof not required by posture (doctrine/consensus)
      L3Status_L3_STATUS_REQUIRED_FAILED: L3 proof required but missing or invalid
      L3Status_L3_STATUS_REQUIRED_VALID: L3 proof required and valid
    x-enum-descriptions:
    - ""
    - L3 proof not required by posture (doctrine/consensus)
    - L3 proof required and valid
    - L3 proof required but missing or invalid
    x-enum-varnames:
    - L3Status_L3_STATUS_UNSPECIFIED
    - L3Status_L3_STATUS_NOT_REQUIRED
    - L3Status_L3_STATUS_REQUIRED_VALID
    - L3Status_L3_STATUS_REQUIRED_FAILED
  operatorv1.ReceiptPersistenceAttestation:
    properties:
      audit_record_id:
        type: string
      persisted_at_unix_ms:
        type: integer
      receipt_signature_digest:
        type: string
      signature:
        type: string
      signer_key_id:
        type: string
      transaction_id:
        type: string
    type: object
  protocol.AttestationFormat:
    enum:
    - packed
    - tpm
    - android-key
    - android-safetynet
    - fido-u2f
    - apple
    - compound
    - none
    type: string
    x-enum-varnames:
    - AttestationFormatPacked
    - AttestationFormatTPM
    - AttestationFormatAndroidKey
    - AttestationFormatAndroidSafetyNet
    - AttestationFormatFIDOUniversalSecondFactor
    - AttestationFormatApple
    - AttestationFormatCompound
    - AttestationFormatNone
  protocol.AuthenticationExtensions:
    properties:
      appid:
        description: AppID is the FIDO AppID Extension input. Authentication only.
        type: string
      appidExclude:
        description: AppIDExclude is the FIDO AppID Exclusion Extension input. Registration
          only.
        type: string
      credBlob:
        description: CredBlob is the blob to store with the credential. Registration
          only.
        items:
          type: integer
        type: array
      credProps:
        description: CredProps requests the Credential Properties Extension. Registration
          only.
        type: boolean
      credentialProtectionPolicy:
        allOf:
        - $ref: '#/definitions/protocol.CredentialProtectionPolicy'
        description: CredentialProtectionPolicy is the CTAP credProtect policy. Registration
          only.
      enforceCredentialProtectionPolicy:
        description: EnforceCredentialProtectionPolicy requires the credProtect policy
          is honoured. Registration only.
        type: boolean
      getCredBlob:
        description: GetCredBlob requests the blob stored with the credential. Authentication
          only.
        type: boolean
      hmacCreateSecret:
        description: HMACCreateSecret requests provisioning of the CTAP hmac-secret.
          Registration only.
        type: boolean
      hmacGetSecret:
        allOf:
        - $ref: '#/definitions/protocol.HMACGetSecretInputs'
        description: HMACGetSecret requests evaluation of the CTAP hmac-secret. Authentication
          only.
      largeBlob:
        allOf:
        - $ref: '#/definitions/protocol.LargeBlobInputs'
        description: LargeBlob is the Large blob storage Extension input.
      minPinLength:
        description: MinPinLength requests the authenticator minimum PIN length. Registration
          only.
        type: boolean
      prf:
        allOf:
        - $ref: '#/definitions/protocol.PRFInputs'
        description: |-
          PRF is the Pseudo-random function Extension input. It is a pointer because an empty dictionary is a
          meaningful input for this extension and only this extension: a Relying Party sends "prf":{} at registration
          to ask whether the pseudo-random function is available for the credential being created, and the client
          answers with the 'enabled' output. A value type combined with omitzero cannot express the difference between
          an absent member and a member present but empty, so a non-nil pointer to a zero value is what carries the
          bare availability probe.
      remoteClientDataJSON:
        description: |-
          RemoteClientDataJSON is the Remote Client Data JSON Extension input. This member is set by a remote desktop
          web client and a Relying Party should not normally set it. See [ExtensionRemoteClientDataJSON], which records
          that this extension is not yet ratified.
        type: string
      uvm:
        description: UVM requests the user verification methods used for the operation.
        type: boolean
    type: object
  protocol.AuthenticatorAttachment:
    enum:
    - platform
    - cross-platform
    type: string
    x-enum-varnames:
    - Platform
    - CrossPlatform
  protocol.AuthenticatorSelection:
    properties:
      authenticatorAttachment:
        allOf:
        - $ref: '#/definitions/protocol.AuthenticatorAttachment'
        description: |-
          AuthenticatorAttachment If this member is present, eligible authenticators are filtered to only
          authenticators attached with the specified AuthenticatorAttachment enum.
      requireResidentKey:
        description: |-
          RequireResidentKey this member describes the Relying Party's requirements regarding resident
          credentials. If the parameter is set to true, the authenticator MUST create a client-side-resident
          public key credential source when creating a public key credential.
        type: boolean
      residentKey:
        allOf:
        - $ref: '#/definitions/protocol.ResidentKeyRequirement'
        description: |-
          ResidentKey this member describes the Relying Party's requirements regarding resident
          credentials per Webauthn Level 2.
      userVerification:
        allOf:
        - $ref: '#/definitions/protocol.UserVerificationRequirement'
        description: |-
          UserVerification This member describes the Relying Party's requirements regarding user verification for
          the create() operation. Eligible authenticators are filtered to only those capable of satisfying this
          requirement.
    type: object
  protocol.AuthenticatorTransport:
    enum:
    - usb
    - nfc
    - ble
    - smart-card
    - hybrid
    - internal
    type: string
    x-enum-varnames:
    - USB
    - NFC
    - BLE
    - SmartCard
    - Hybrid
    - Internal
