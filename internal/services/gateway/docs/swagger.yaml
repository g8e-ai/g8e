basePath: /api/v1
definitions:
  constants.GatewayMode:
    enum:
    - gateway
    - ok
    type: string
    x-enum-varnames:
    - GatewayModeGateway
    - GatewayModeStatusOK
  gateway.AppEnrollResponse:
    properties:
      app_cert:
        type: string
      app_id:
        type: string
      cert_chain:
        type: string
      error:
        type: string
      expires_at:
        type: string
      success:
        type: boolean
      trust_bundle:
        type: string
    type: object
  models.HealthResponse:
    properties:
      governance_ready:
        type: boolean
      mode:
        $ref: '#/definitions/constants.GatewayMode'
      state_merkle_root:
        type: string
      status:
        $ref: '#/definitions/constants.GatewayMode'
      version:
        type: string
    type: object
  models.PKICSRSignResponse:
    properties:
      certificate_chain_pem:
        type: string
      certificate_pem:
        type: string
    type: object
  models.StatusResponse:
    properties:
      status:
        $ref: '#/definitions/constants.GatewayMode'
    type: object
host: localhost:8443
info:
  contact:
    email: support@g8e.ai
    name: g8e Team
    url: https://github.com/g8e-ai/g8e
  description: API documentation for the g8e Gateway public endpoints
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://github.com/g8e-ai/g8e
  title: g8e Gateway API
  version: "1.0"
paths:
  /:
    get:
      consumes:
      - text/html
      description: Returns the public landing page for the gateway
      produces:
      - text/html
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Landing page
      tags:
      - public
  /.well-known/g8e/bin/{filename}:
    get:
      description: Downloads the g8e node binary for the current platform (internal
        endpoint)
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
      summary: Download node binary
      tags:
      - bootstrap
  /.well-known/g8e/pki/ca-bundle:
    get:
      consumes:
      - application/json
      description: Returns the platform's root CA certificate bundle for trust establishment
      produces:
      - application/x-pem-file
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Get CA bundle
      tags:
      - pki
  /.well-known/g8e/pki/crl:
    get:
      consumes:
      - application/json
      description: Returns the certificate revocation list
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get CRL
      tags:
      - pki
  /.well-known/g8e/pki/fingerprint:
    get:
      consumes:
      - application/json
      description: Returns the platform's PKI fingerprint for verification
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get PKI fingerprint
      tags:
      - pki
  /.well-known/g8e/pki/trust-windows:
    get:
      description: Returns the Windows CA trust bootstrap script (alias endpoint)
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Bootstrap CA Windows script (alias)
      tags:
      - bootstrap
  /api/v1/auth/bootstrap:
    post:
      consumes:
      - application/json
      description: Initiates local bootstrap authentication flow
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Bootstrap auth
      tags:
      - auth
  /api/v1/auth/bootstrap/status:
    get:
      consumes:
      - application/json
      description: Returns the current bootstrap status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Bootstrap status
      tags:
      - auth
  /api/v1/auth/cli/enroll:
    post:
      consumes:
      - application/json
      description: Enrolls a CLI client with the gateway
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: CLI enrollment
      tags:
      - auth
  /api/v1/auth/device/enroll:
    post:
      consumes:
      - application/json
      description: Enrolls a device with the gateway
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Device enrollment
      tags:
      - auth
  /api/v1/auth/passkeys/cli-register/challenge:
    post:
      consumes:
      - application/json
      description: Initiates passkey registration for CLI bootstrap
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Passkey CLI register challenge
      tags:
      - auth
  /api/v1/auth/passkeys/cli-register/verify:
    post:
      consumes:
      - application/json
      description: Verifies passkey registration for CLI bootstrap
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Passkey CLI register verify
      tags:
      - auth
  /api/v1/auth/passkeys/cli/authenticate/challenge:
    post:
      consumes:
      - application/json
      description: Initiates passkey authentication for CLI bootstrap
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Passkey CLI authenticate challenge
      tags:
      - auth
  /api/v1/auth/passkeys/cli/authenticate/verify:
    post:
      consumes:
      - application/json
      description: Verifies passkey authentication for CLI bootstrap
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Passkey CLI authenticate verify
      tags:
      - auth
  /api/v1/data/blobs/{namespace}/{id}:
    get:
      description: Retrieves a blob from the data store
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
      summary: Get blob
      tags:
      - data
  /api/v1/pki/apps/enroll:
    post:
      consumes:
      - application/json
      description: Enrolls an external app via PKI endpoint (identity-only enrollment)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gateway.AppEnrollResponse'
      summary: PKI app enrollment
      tags:
      - pki
  /api/v1/pki/certificates/revoke:
    post:
      consumes:
      - application/json
      description: Revokes a certificate by serial number (internal mTLS endpoint)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.StatusResponse'
      summary: Revoke certificate
      tags:
      - pki
  /api/v1/pki/csr/sign:
    post:
      consumes:
      - application/json
      description: Signs a certificate signing request (internal mTLS endpoint)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PKICSRSignResponse'
      summary: Sign CSR
      tags:
      - pki
  /api/v1/pki/devices/enroll:
    post:
      consumes:
      - application/json
      description: Enrolls a device via PKI endpoint
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: PKI device enrollment
      tags:
      - pki
  /bootstrap-ca:
    get:
      description: Returns the Linux CA trust bootstrap script
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Bootstrap CA Linux script
      tags:
      - bootstrap
  /bootstrap-ca.ps1:
    get:
      description: Returns the Windows CA trust bootstrap script
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Bootstrap CA Windows script
      tags:
      - bootstrap
  /g8e-operator.ps1:
    get:
      description: Returns the Windows operator deployment script
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Deploy script Windows
      tags:
      - deploy
  /g8e-operator.sh:
    get:
      description: Returns the Linux operator deployment script
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Deploy script Linux
      tags:
      - deploy
  /health:
    get:
      consumes:
      - application/json
      description: Returns the current health status of the gateway
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.HealthResponse'
      summary: Health check
      tags:
      - health
  /health/bootstrap:
    get:
      consumes:
      - application/json
      description: Returns the current health status during bootstrap (no state root
        check)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.HealthResponse'
      summary: Bootstrap health check
      tags:
      - health
securityDefinitions:
  BearerAuth:
    description: Bearer token authentication (JWT or mTLS certificate)
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
