services:
  metadata-server:
    container_name: pnfs-metadata-server
    build:
      context: ./containers/metadata-server
      dockerfile: Dockerfile
    privileged: true
    healthcheck:
      test: ["CMD", "rpcinfo", "-p"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      demo.service: pnfs-node

  data-server:
    container_name: pnfs-data-server
    build:
      context: ./containers/data-server
      dockerfile: Dockerfile
    privileged: true
    labels:
      demo.service: pnfs-node

  client-node:
    container_name: pnfs-client-node
    build:
      context: ./containers/client-node
      dockerfile: Dockerfile
    privileged: true
    environment:
      - DEVICE_NAME=client-node
      - DEVICE_ROLE=governance-tester
    volumes:
      - ../../../.g8e/pki/root/root_ca.crt:/operator/ca.crt:ro
    labels:
      demo.service: pnfs-node
    depends_on:
      - metadata-server
      - data-server
